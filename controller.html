<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napat Karaoke Pro - TV</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* =========================
   BACKGROUND
========================= */

#background {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: #000;
}

.bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.2s ease;
}

.bg-layer.active {
    opacity: 1;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.60)
        );
}

/* =========================
   PLAYER
========================= */

#player-wrapper {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    background: #000;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100% !important;
    height: 100% !important;
}

/* =========================
   TOP BAR
========================= */

#top-bar {
    position: absolute;
    top: 22px;
    left: 30px;
    right: 30px;
    z-index: 20;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

#brand {
    padding: 10px 18px;
    border-radius: 14px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    font-size: 22px;
    font-weight: bold;
}

#room-info {
    padding: 10px 18px;
    border-radius: 14px;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
    font-size: 18px;
}

/* =========================
   NOW PLAYING
========================= */

#now-playing {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-15px);

    z-index: 30;

    min-width: 420px;
    max-width: 80vw;

    padding: 14px 28px;

    border-radius: 18px;

    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,255,255,.18);

    text-align: center;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .35s ease,
        transform .35s ease,
        visibility .35s ease;

    pointer-events: none;
}

#now-playing.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

#now-playing .label {
    font-size: 16px;
    font-weight: bold;
    opacity: .75;
    margin-bottom: 5px;
}

#now-title {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.25;
}

/* =========================
   QUEUE
========================= */

#queue-box {
    position: absolute;
    right: 30px;
    bottom: 30px;

    z-index: 25;

    width: 360px;
    max-height: 55vh;

    padding: 18px;

    border-radius: 18px;

    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);

    opacity: 0;
    visibility: hidden;

    transition: opacity .35s ease;
}

#queue-box.show {
    opacity: 1;
    visibility: visible;
}

#queue-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.queue-item {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 9px 0;

    border-bottom: 1px solid rgba(255,255,255,.12);
}

.queue-item:last-child {
    border-bottom: none;
}

.queue-number {
    width: 28px;
    text-align: center;
    font-weight: bold;
}

.queue-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.queue-current {
    color: #00ff99;
}

/* =========================
   QR
========================= */

#qr-box {
    position: absolute;
    left: 30px;
    bottom: 30px;

    z-index: 25;

    width: 210px;

    padding: 14px;

    border-radius: 18px;

    background: rgba(255,255,255,.95);

    color: #111;

    text-align: center;

    box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

#qrcode {
    width: 180px;
    height: 180px;
    margin: auto;
}

#qrcode img,
#qrcode canvas {
    width: 180px !important;
    height: 180px !important;
}

#qr-label {
    margin-top: 9px;
    font-size: 15px;
    font-weight: bold;
}

#qr-url {
    margin-top: 4px;
    font-size: 10px;
    word-break: break-all;
    opacity: .65;
}

/* =========================
   IDLE
========================= */

#empty-state {
    position: absolute;
    inset: 0;

    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    pointer-events: none;
}

#empty-state-inner {
    margin-top: -20px;
}

#empty-state .main {
    font-size: 48px;
    font-weight: bold;
    text-shadow: 0 5px 25px rgba(0,0,0,.8);
}

#empty-state .sub {
    margin-top: 12px;
    font-size: 22px;
    opacity: .85;
}

/* =========================
   SCORE
========================= */

#score-overlay {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.38);

    opacity: 0;
    visibility: hidden;

    transition: opacity .35s ease;
}

#score-overlay.show {
    opacity: 1;
    visibility: visible;
}

#score-card {
    min-width: 420px;
    padding: 35px 50px;

    border-radius: 30px;

    background: rgba(0,0,0,.78);
    backdrop-filter: blur(12px);

    text-align: center;

    box-shadow: 0 20px 80px rgba(0,0,0,.6);
}

#score-label {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 10px;
}

#score-number {
    font-size: 100px;
    line-height: 1;
    font-weight: 900;
}

#score-message {
    margin-top: 12px;
    font-size: 24px;
}

/* =========================
   START OVERLAY
========================= */

#start-overlay {
    position: absolute;
    inset: 0;

    z-index: 200;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.72);
}

#start-button {
    padding: 20px 42px;

    border: none;
    border-radius: 18px;

    background: #fff;
    color: #111;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;
}

#start-button:hover {
    transform: scale(1.03);
}

/* =========================
   MOBILE / SMALL SCREEN
========================= */

@media (max-width: 900px) {
    #queue-box {
        width: 300px;
        right: 15px;
        bottom: 15px;
    }

    #qr-box {
        left: 15px;
        bottom: 15px;
        transform: scale(.85);
        transform-origin: bottom left;
    }

    #now-playing {
        min-width: 300px;
        max-width: 85vw;
    }

    #now-title {
        font-size: 22px;
    }

    #score-card {
        min-width: 320px;
    }
}
</style></head><body><div id="app"><!-- BACKGROUND -->
<div id="background">
    <div id="bg1" class="bg-layer active"></div>

</div>

<!-- YOUTUBE PLAYER -->

<!-- TOP BAR -->
<div id="top-bar">

    </div>

    <div id="room-info">

<div id="now-playing">

</div>

        <div class="main">

        </div>

    </div>

</div>

<!-- SCORE -->
<div id="score-overlay">

    <div id="score-card">

        <div id="score-label">

        </div>

        </div>

    </button>

</div>

</div><script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let peer = null;
let connObj = null;

let currentRoom = "";

let queue = [];

let player = null;

let isAppReady = false;

let transitionLock = false;

let uiTimer = null;
let scoreTimer = null;
let bgTimer = null;

let bgIndex = 0;
let activeBg = 1;

let scoreWatcher = null;


/* =========================================================
   DOM
========================================================= */

const roomIdEl = document.getElementById("room-id");

const playerWrapper = document.getElementById("player-wrapper");

const nowPlaying = document.getElementById("now-playing");
const nowTitle = document.getElementById("now-title");

const queueBox = document.getElementById("queue-box");
const queueList = document.getElementById("queue-list");

const emptyState = document.getElementById("empty-state");

const scoreOverlay = document.getElementById("score-overlay");
const scoreNumber = document.getElementById("score-number");
const scoreMessage = document.getElementById("score-message");

const startOverlay = document.getElementById("start-overlay");
const startButton = document.getElementById("start-button");

const qrcodeEl = document.getElementById("qrcode");
const qrUrlEl = document.getElementById("qr-url");

const bg1 = document.getElementById("bg1");
const bg2 = document.getElementById("bg2");


/* =========================================================
   BACKGROUNDS
========================================================= */

const backgrounds = [
    "https://picsum.photos/id/1011/1920/1080",
    "https://picsum.photos/id/1015/1920/1080",
    "https://picsum.photos/id/1016/1920/1080",
    "https://picsum.photos/id/1025/1920/1080",
    "https://picsum.photos/id/1039/1920/1080"
];


function startBackgroundRotation() {

    clearInterval(bgTimer);

    bgIndex = 0;

    bg1.style.backgroundImage =
        `url("${backgrounds[0]}")`;

    bg2.style.backgroundImage =
        `url("${backgrounds[1]}")`;

    bg1.classList.add("active");
    bg2.classList.remove("active");

    activeBg = 1;

    bgTimer = setInterval(() => {

        bgIndex++;

        if (bgIndex >= backgrounds.length) {
            bgIndex = 0;
        }

        const nextIndex =
            (bgIndex + 1) % backgrounds.length;

        if (activeBg === 1) {

            bg2.style.backgroundImage =
                `url("${backgrounds[bgIndex]}")`;

            bg2.classList.add("active");
            bg1.classList.remove("active");

            activeBg = 2;

        } else {

            bg1.style.backgroundImage =
                `url("${backgrounds[bgIndex]}")`;

            bg1.classList.add("active");
            bg2.classList.remove("active");

            activeBg = 1;
        }

    }, 10000);
}


/* =========================================================
   UI
========================================================= */

function showUI() {

    if (queue.length > 0) {
        queueBox.classList.add("show");
    }
}


function hideUI() {
    queueBox.classList.remove("show");
}


function hideNowPlaying() {

    nowPlaying.classList.remove("show");
}


function showNowPlaying(title) {

    clearTimeout(uiTimer);

    nowTitle.textContent =
        title || "กำลังเล่นเพลง";

    nowPlaying.classList.add("show");

    /*
       NOW PLAYING แสดง 8 วินาที
    */

    uiTimer = setTimeout(() => {

        hideNowPlaying();
        hideUI();

    }, 8000);
}


/* =========================================================
   IDLE SCREEN
========================================================= */

function showIdleScreen() {

    clearTimeout(uiTimer);
    clearTimeout(scoreTimer);

    stopScoreWatcher();

    hideNowPlaying();
    hideUI();

    scoreOverlay.classList.remove("show");

    playerWrapper.style.display = "none";

    emptyState.style.display = "flex";

    startBackgroundRotation();

    if (player) {

        try {
            player.stopVideo();
        } catch (e) {
            console.warn("stopVideo:", e);
        }
    }
}


/* =========================================================
   QR CODE
========================================================= */

function createControllerQR() {

    if (!currentRoom) {
        console.warn("Cannot create QR: room is empty");
        return;
    }

    /*
       สำคัญ:
       QR ต้องชี้ไป controller.html เท่านั้น
       ไม่ใช้ location.href
       ไม่ใช้ pathname ของ display.html
    */

    const controllerUrl =
        `${window.location.origin}/controller.html?room=${encodeURIComponent(currentRoom)}`;

    console.log("Controller QR URL:", controllerUrl);

    qrcodeEl.innerHTML = "";

    new QRCode(qrcodeEl, {
        text: controllerUrl,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.M
    });

    qrUrlEl.textContent = controllerUrl;
}


/* =========================================================
   ROOM
========================================================= */

function generateRoomId() {

    return "room_" +
        Math.random()
            .toString(36)
            .substring(2, 7)
            .toUpperCase();
}


function initRoom() {

    currentRoom =
        sessionStorage.getItem("k_room");

    if (!currentRoom) {

        currentRoom =
            generateRoomId();

        sessionStorage.setItem(
            "k_room",
            currentRoom
        );
    }

    roomIdEl.textContent =
        currentRoom;

    createControllerQR();

    peer = new Peer(currentRoom);

    peer.on("open", id => {

        console.log(
            "Peer opened:",
            id
        );

        currentRoom = id;

        sessionStorage.setItem(
            "k_room",
            id
        );

        roomIdEl.textContent = id;

        createControllerQR();
    });


    peer.on("connection", conn => {

        console.log(
            "Controller connected:",
            conn.peer
        );

        connObj = conn;

        conn.on("open", () => {

            console.log(
                "Controller connection opened"
            );

            sendQueueUpdate();
        });


        conn.on("data", data => {

            console.log(
                "Controller command:",
                data
            );

            handleCommand(data);
        });


        conn.on("close", () => {

            console.log(
                "Controller disconnected"
            );

            if (connObj === conn) {
                connObj = null;
            }
        });


        conn.on("error", err => {

            console.error(
                "Connection error:",
                err
            );

            if (connObj === conn) {
                connObj = null;
            }
        });

    });


    peer.on("error", err => {

        console.error(
            "Peer error:",
            err
        );

        /*
           หาก room ชนกัน ให้สร้าง room ใหม่
        */

        if (
            err.type === "unavailable-id" ||
            err.type === "peer-unavailable"
        ) {

            sessionStorage.removeItem(
                "k_room"
            );

            setTimeout(() => {
                location.reload();
            }, 1000);
        }
    });
}


/* =========================================================
   QUEUE
========================================================= */

function sendToController(data) {

    if (
        connObj &&
        connObj.open
    ) {

        try {
            connObj.send(data);
        } catch (e) {

            console.error(
                "Send error:",
                e
            );
        }
    }
}


function sendQueueUpdate() {

    sendToController({
        type: "QUEUE_UPDATE",
        queue: queue
    });
}


function syncQueue() {

    updateQueueUI();

    sendQueueUpdate();
}


function updateQueueUI() {

    queueList.innerHTML = "";

    if (queue.length === 0) {

        queueBox.classList.remove("show");

        return;
    }

    queueBox.classList.add("show");

    queue.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.className =
            "queue-item";

        if (index === 0) {
            item.classList.add(
                "queue-current"
            );
        }

        const number =
            document.createElement("div");

        number.className =
            "queue-number";

        number.textContent =
            index + 1;


        const name =
            document.createElement("div");

        name.className =
            "queue-name";

        name.textContent =
            song.title || "ไม่ทราบชื่อ";


        item.appendChild(number);
        item.appendChild(name);

        queueList.appendChild(item);
    });
}


/* =========================================================
   COMMAND HANDLER
========================================================= */

function handleCommand(data) {

    if (!data || !data.type) {
        return;
    }


    switch (data.type) {

        case "ADD_SONG":
            addSong(data.song);
            break;


        case "SKIP":
            skipSong();
            break;


        case "TOGGLE_PLAY":
            togglePlay();
            break;


        case "DELETE_SONG":
            deleteSong(data.index);
            break;


        case "MOVE_SONG":
            moveSong(
                data.from,
                data.to
            );
            break;


        case "RETRY_PLAY":
            retryCurrentSong();
            break;


        default:
            console.warn(
                "Unknown command:",
                data.type
            );
    }
}


/* =========================================================
   ADD SONG
========================================================= */

function addSong(song) {

    if (!song || !song.videoId) {

        console.warn(
            "Invalid song:",
            song
        );

        return;
    }

    queue.push({
        videoId: song.videoId,
        title: song.title || "เพลงไม่ทราบชื่อ",
        thumbnail: song.thumbnail || ""
    });

    console.log(
        "Song added:",
        song.title
    );

    syncQueue();

    /*
       ถ้าเป็นเพลงแรก
       ให้เริ่มเล่นทันที
    */

    if (
        queue.length === 1 &&
        isAppReady &&
        player
    ) {

        playCurrent();
    }
}


/* =========================================================
   PLAY CURRENT
========================================================= */

function playCurrent() {

    if (
        !player ||
        queue.length === 0
    ) {

        if (queue.length === 0) {
            showIdleScreen();
        }

        return;
    }

    const song =
        queue[0];

    transitionLock = false;

    emptyState.style.display =
        "none";

    playerWrapper.style.display =
        "block";

    startBackgroundRotation();

    showNowPlaying(
        song.title
    );

    updateQueueUI();

    try {

        player.loadVideoById(
            song.videoId
        );

    } catch (e) {

        console.error(
            "loadVideoById error:",
            e
        );
    }
}


/* =========================================================
   YOUTUBE
========================================================= */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube API ready"
    );

    player =
        new YT.Player(
            "player",
            {
                width: "100%",
                height: "100%",

                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },

                events: {
                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError
                }
            }
        );
}


function onPlayerReady() {

    console.log(
        "YouTube player ready"
    );

    isAppReady = true;

    /*
       ถ้ามีเพลงรออยู่
       เริ่มเล่นเพลงแรก
    */

    if (queue.length > 0) {
        playCurrent();
    }
}


function disableYouTubeCaptions() {

    try {

        if (player) {

            player.unloadModule(
                "captions"
            );
        }

    } catch (e) {
        console.warn(
            "Caption disable:",
            e
        );
    }
}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        disableYouTubeCaptions();

        startScoreWatcher();

    } else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        showUI();

        stopScoreWatcher();

    } else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        finishCurrentSong();
    }
}


/* =========================================================
   FINISH SONG
========================================================= */

function finishCurrentSong() {

    if (transitionLock) {
        return;
    }

    transitionLock = true;

    clearTimeout(uiTimer);

    stopScoreWatcher();

    /*
       เอาเพลงที่เล่นจบออกจากคิวทันที
    */

    if (queue.length > 0) {
        queue.shift();
    }

    syncQueue();

    /*
       แสดงคะแนน 8 วินาที
    */

    showScore();

    clearTimeout(scoreTimer);

    scoreTimer =
        setTimeout(() => {

            hideScore();

            if (queue.length > 0) {

                transitionLock = false;

                playCurrent();

            } else {

                transitionLock = false;

                showIdleScreen();
            }

        }, 8000);
}


/* =========================================================
   MANUAL SKIP
========================================================= */

function skipSong() {

    clearTimeout(scoreTimer);
    clearTimeout(uiTimer);

    stopScoreWatcher();

    hideScore();
    hideNowPlaying();

    if (queue.length === 0) {

        showIdleScreen();

        return;
    }

    transitionLock = true;

    /*
       ลบเพลงปัจจุบัน
    */

    queue.shift();

    syncQueue();

    if (queue.length > 0) {

        transitionLock = false;

        playCurrent();

    } else {

        transitionLock = false;

        showIdleScreen();
    }
}


/* =========================================================
   TOGGLE PLAY
========================================================= */

function togglePlay() {

    if (!player) {
        return;
    }

    try {

        const state =
            player.getPlayerState();

        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        } else {

            player.playVideo();
        }

    } catch (e) {

        console.error(
            "Toggle error:",
            e
        );
    }
}


/* =========================================================
   DELETE SONG
========================================================= */

function deleteSong(index) {

    if (
        typeof index !== "number" ||
        index < 0 ||
        index >= queue.length
    ) {
        return;
    }

    /*
       ลบเพลงปัจจุบัน
    */

    if (index === 0) {

        clearTimeout(scoreTimer);
        clearTimeout(uiTimer);

        stopScoreWatcher();

        queue.shift();

        syncQueue();

        if (queue.length > 0) {

            playCurrent();

        } else {

            showIdleScreen();
        }

        return;
    }


    /*
       ลบเพลงในคิว
    */

    queue.splice(
        index,
        1
    );

    syncQueue();
}


/* =========================================================
   MOVE SONG
========================================================= */

function moveSong(from, to) {

    if (
        typeof from !== "number" ||
        typeof to !== "number"
    ) {
        return;
    }

    /*
       ห้ามย้ายเพลงปัจจุบัน
    */

    if (
        from <= 0 ||
        to <= 0 ||
        from >= queue.length ||
        to >= queue.length
    ) {
        return;
    }

    const song =
        queue.splice(
            from,
            1
        )[0];

    queue.splice(
        to,
        0,
        song
    );

    syncQueue();
}


/* =========================================================
   RETRY
========================================================= */

function retryCurrentSong() {

    if (
        queue.length === 0 ||
        !player
    ) {
        return;
    }

    playCurrent();
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube player error:",
        event.data
    );

    stopScoreWatcher();

    /*
       รอเล็กน้อยแล้วข้ามเพลงเสีย
    */

    setTimeout(() => {

        if (queue.length === 0) {

            showIdleScreen();

            return;
        }

        queue.shift();

        syncQueue();

        if (queue.length > 0) {

            playCurrent();

        } else {

            showIdleScreen();
        }

    }, 1500);
}


/* =========================================================
   SCORE WATCHER
========================================================= */

function startScoreWatcher() {

    stopScoreWatcher();

    scoreWatcher =
        setInterval(() => {

            if (
                !player ||
                queue.length === 0
            ) {
                return;
            }

            try {

                const duration =
                    player.getDuration();

                const current =
                    player.getCurrentTime();

                if (
                    duration > 0 &&
                    duration - current <= 5 &&
                    duration - current > 0
                ) {

                    showScore();

                    /*
                       ไม่ให้แสดงซ้ำ
                    */

                    stopScoreWatcher();
                }

            } catch (e) {

                console.warn(
                    "Score watcher:",
                    e
                );
            }

        }, 500);
}


function stopScoreWatcher() {

    if (scoreWatcher) {

        clearInterval(
            scoreWatcher
        );

        scoreWatcher = null;
    }
}


/* =========================================================
   SCORE
========================================================= */

function showScore() {

    /*
       สุ่มคะแนน 80 - 100
    */

    const score =
        Math.floor(
            Math.random() * 21
        ) + 80;

    scoreNumber.textContent =
        score;

    if (score >= 95) {

        scoreMessage.textContent =
            "สุดยอดมาก! 🔥";

    } else if (score >= 90) {

        scoreMessage.textContent =
            "เยี่ยมมาก! 🎤";

    } else if (score >= 85) {

        scoreMessage.textContent =
            "ทำได้ดีครับ 👍";

    } else {

        scoreMessage.textContent =
            "เก่งมากครับ 👏";
    }

    scoreOverlay.classList.add(
        "show"
    );
}


function hideScore() {

    scoreOverlay.classList.remove(
        "show"
    );
}


/* =========================================================
   INIT APP
========================================================= */

function initApp() {

    startOverlay.style.display =
        "none";

    initRoom();

    startBackgroundRotation();

    /*
       โหลด YouTube IFrame API
    */

    if (
        !window.YT ||
        !window.YT.Player
    ) {

        const tag =
            document.createElement(
                "script"
            );

        tag.src =
            "https://www.youtube.com/iframe_api";

        document.head.appendChild(
            tag
        );

    } else {

        onYouTubeIframeAPIReady();
    }

    showIdleScreen();
}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        initApp();

    }
);


/* =========================================================
   DEBUG
========================================================= */

window.addEventListener(
    "error",
    event => {

        console.error(
            "Global error:",
            event.error ||
            event.message
        );
    }
);
