<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Napat Karaoke Pro — Display</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    position: relative;
}

/* =========================
   BACKGROUND / IDLE SCREEN
========================= */

#background {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #000;
    overflow: hidden;
}

.bg-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.2s ease;
}

.bg-layer.active {
    opacity: 1;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.25),
            rgba(0,0,0,.05) 45%,
            rgba(0,0,0,.55)
        );
}

/* =========================
   APP
========================= */

#app {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

/* =========================
   TOP BAR
========================= */

#top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px 24px;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.85),
        rgba(0,0,0,0)
    );

    opacity: 1;
    transition: opacity .5s ease;
}

#top-bar.hidden {
    opacity: 0;
}

.brand {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: .5px;
}

.brand span {
    color: #ffcc00;
}

#connection-status {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 14px;
    padding: 7px 12px;

    border-radius: 20px;
    background: rgba(0,0,0,.55);
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #777;
}

.status-dot.online {
    background: #22c55e;
    box-shadow: 0 0 10px #22c55e;
}

/* =========================
   PLAYER
========================= */

#player-wrapper {
    position: absolute;
    inset: 0;

    background: #000;

    display: none;
    align-items: center;
    justify-content: center;
}

#player {
    width: 100%;
    height: 100%;
}

/* =========================
   NOW PLAYING
========================= */

#now-playing {
    position: absolute;
    left: 50%;
    bottom: 55px;

    transform: translateX(-50%);

    width: min(90%, 900px);

    padding: 16px 24px;

    border-radius: 18px;

    background: rgba(0,0,0,.78);
    backdrop-filter: blur(10px);

    text-align: center;

    box-shadow: 0 8px 35px rgba(0,0,0,.45);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .45s ease,
        transform .45s ease,
        visibility .45s ease;

    pointer-events: none;
}

#now-playing.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.now-label {
    font-size: 14px;
    font-weight: 700;
    color: #ffcc00;
    margin-bottom: 5px;
    letter-spacing: 1px;
}

#now-title {
    font-size: 27px;
    font-weight: 800;
    line-height: 1.25;
    word-break: break-word;
}

/* =========================
   QUEUE BOX
========================= */

#queue-box {
    position: absolute;
    right: 22px;
    bottom: 22px;

    width: min(390px, 35vw);

    max-height: 48vh;

    padding: 15px;

    border-radius: 18px;

    background: rgba(0,0,0,.72);
    backdrop-filter: blur(12px);

    box-shadow: 0 10px 35px rgba(0,0,0,.4);

    opacity: 0;
    visibility: hidden;

    transform: translateY(10px);

    transition:
        opacity .4s ease,
        transform .4s ease,
        visibility .4s ease;
}

#queue-box.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.queue-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;

    font-weight: 800;
    font-size: 18px;
}

.queue-count {
    color: #ffcc00;
}

#queue-list {
    display: flex;
    flex-direction: column;
    gap: 7px;

    max-height: 39vh;
    overflow: hidden;
}

.queue-item {
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 9px 10px;

    border-radius: 10px;

    background: rgba(255,255,255,.08);
}

.queue-item.current {
    background: rgba(255,204,0,.18);
    border: 1px solid rgba(255,204,0,.35);
}

.queue-number {
    width: 28px;
    flex: 0 0 28px;

    text-align: center;

    font-weight: 800;
    color: #ffcc00;
}

.queue-title {
    flex: 1;

    font-size: 14px;
    line-height: 1.25;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   QR
========================= */

#qr-panel {
    position: absolute;
    top: 75px;
    right: 24px;

    padding: 12px;

    border-radius: 16px;

    background: rgba(0,0,0,.68);
    backdrop-filter: blur(10px);

    text-align: center;

    opacity: 1;
    transition: opacity .4s ease;
}

#qr-panel.hidden {
    opacity: 0;
}

#qrcode {
    width: 130px;
    height: 130px;

    background: #fff;

    padding: 5px;
    border-radius: 8px;
}

.qr-text {
    margin-top: 8px;

    font-size: 13px;
    font-weight: 700;
}

/* =========================
   EMPTY / IDLE
========================= */

#empty-state {
    position: absolute;
    inset: 0;

    z-index: 20;

    display: none;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    background: rgba(0,0,0,.15);

    pointer-events: none;
}

.empty-title {
    font-size: clamp(30px, 5vw, 60px);
    font-weight: 900;

    text-shadow: 0 4px 20px rgba(0,0,0,.7);
}

.empty-subtitle {
    margin-top: 12px;

    font-size: clamp(16px, 2vw, 25px);

    opacity: .9;
}

/* =========================
   START OVERLAY
========================= */

#start-overlay {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #050505;

    cursor: pointer;
}

.start-box {
    text-align: center;
}

.start-box h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 5vw, 60px);
}

.start-box p {
    margin: 0;
    opacity: .75;
    font-size: 18px;
}

.start-button {
    margin-top: 25px;

    display: inline-block;

    padding: 15px 30px;

    border-radius: 30px;

    background: #ffcc00;
    color: #111;

    font-size: 20px;
    font-weight: 900;
}

/* =========================
   SCORE
========================= */

#score-overlay {
    position: fixed;
    inset: 0;

    z-index: 90;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: rgba(0,0,0,.45);

    backdrop-filter: blur(4px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .4s ease,
        visibility .4s ease;
}

#score-overlay.show {
    opacity: 1;
    visibility: visible;
}

.score-number {
    font-size: clamp(80px, 18vw, 220px);
    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 8px 30px rgba(0,0,0,.8);
}

.score-message {
    margin-top: 15px;

    font-size: clamp(22px, 4vw, 50px);

    font-weight: 800;

    text-align: center;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    #top-bar {
        padding: 12px 15px;
    }

    .brand {
        font-size: 18px;
    }

    #qr-panel {
        top: 58px;
        right: 12px;
        transform: scale(.75);
        transform-origin: top right;
    }

    #queue-box {
        left: 12px;
        right: 12px;
        bottom: 12px;

        width: auto;

        max-height: 30vh;
    }

    #queue-list {
        max-height: 22vh;
    }

    #now-playing {
        left: 12px;
        right: 12px;
        bottom: 15px;

        width: auto;

        transform: translateY(10px);
    }

    #now-playing.show {
        transform: translateY(0);
    }

    #now-title {
        font-size: 19px;
    }
}
</style></head><body><!-- =========================
     BACKGROUND
========================= --><div id="background">
    <div id="bg1" class="bg-layer active"></div>
    <div id="bg2" class="bg-layer"></div>
</div><!-- =========================
     APP
========================= --><div id="app"><div id="player-wrapper">
    <div id="player"></div>
</div>

<div id="top-bar">
    <div class="brand">
        Napat <span>Karaoke</span>
    </div>

    <div id="connection-status">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">กำลังเชื่อมต่อ...</span>
    </div>
</div>

<div id="qr-panel">
    <div id="qrcode"></div>
    <div class="qr-text">
        สแกนเพื่อเลือกเพลง
    </div>
</div>

<div id="now-playing">
    <div class="now-label">NOW PLAYING</div>
    <div id="now-title">-</div>
</div>

<div id="queue-box">
    <div class="queue-header">
        <span>คิวเพลง</span>
        <span id="queue-count" class="queue-count">0</span>
    </div>

    <div id="queue-list"></div>
</div>

<div id="empty-state">
    <div class="empty-title">
        พร้อมร้องแล้วหรือยัง?
    </div>

    <div class="empty-subtitle">
        สแกน QR Code เพื่อเลือกเพลง
    </div>
</div>

</div><!-- =========================
     START OVERLAY
========================= --><div id="start-overlay">
    <div class="start-box">
        <h1>Napat Karaoke Pro</h1>
        <p>กดเพื่อเริ่มระบบ Karaoke</p>    <div class="start-button">
        เริ่มใช้งาน
    </div>
</div>

</div><!-- =========================
     SCORE
========================= --><div id="score-overlay">
    <div id="score-number" class="score-number">
        0
    </div><div id="score-message" class="score-message">
    เยี่ยมมาก!
</div>

</div><script>
/* =========================================================
   STATE
========================================================= */

let peer = null;
let connObj = null;

let currentRoom = "";

let queue = [];

let player = null;

let isAppReady = false;

/*
 * ใช้สำหรับป้องกัน event ENDED / ERROR
 * ถูกเรียกซ้ำจน queue shift หลายครั้ง
 */
let transitionLock = false;

let uiTimer = null;

let scoreTimer = null;

let bgTimer = null;

let bgIndex = 0;

let activeBg = 1;


/* =========================================================
   ELEMENTS
========================================================= */

const startOverlay = document.getElementById("start-overlay");

const playerWrapper = document.getElementById("player-wrapper");

const nowPlaying = document.getElementById("now-playing");
const nowTitle = document.getElementById("now-title");

const queueBox = document.getElementById("queue-box");
const queueList = document.getElementById("queue-list");
const queueCount = document.getElementById("queue-count");

const qrPanel = document.getElementById("qr-panel");
const qrCode = document.getElementById("qrcode");

const emptyState = document.getElementById("empty-state");

const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");

const scoreOverlay = document.getElementById("score-overlay");
const scoreNumber = document.getElementById("score-number");
const scoreMessage = document.getElementById("score-message");


/* =========================================================
   BACKGROUND
========================================================= */

const backgrounds = [
    "https://picsum.photos/id/1011/1920/1080",
    "https://picsum.photos/id/1015/1920/1080",
    "https://picsum.photos/id/1016/1920/1080",
    "https://picsum.photos/id/1025/1920/1080",
    "https://picsum.photos/id/1039/1920/1080"
];

function getNextBackground() {
    bgIndex++;

    if (bgIndex >= backgrounds.length) {
        bgIndex = 0;
    }

    return backgrounds[bgIndex];
}

function startBackgroundRotation() {

    stopBackgroundRotation();

    bgTimer = setInterval(() => {

        const nextUrl = getNextBackground();

        const nextLayer =
            activeBg === 1
                ? document.getElementById("bg2")
                : document.getElementById("bg1");

        const currentLayer =
            activeBg === 1
                ? document.getElementById("bg1")
                : document.getElementById("bg2");

        nextLayer.style.backgroundImage =
            `url("${nextUrl}")`;

        nextLayer.classList.add("active");
        currentLayer.classList.remove("active");

        activeBg =
            activeBg === 1
                ? 2
                : 1;

    }, 20000);
}

function stopBackgroundRotation() {

    if (bgTimer) {
        clearInterval(bgTimer);
        bgTimer = null;
    }
}


/* =========================================================
   UI CONTROL
========================================================= */

function showUI() {

    clearTimeout(uiTimer);

    document
        .getElementById("top-bar")
        .classList.remove("hidden");

    qrPanel.classList.remove("hidden");

    /*
     * ถ้ามีคิวมากกว่า 1 เพลง
     * แสดง queue
     */
    if (queue.length > 0) {
        queueBox.classList.add("show");
    }
}

function hideUI() {

    document
        .getElementById("top-bar")
        .classList.add("hidden");

    qrPanel.classList.add("hidden");

    queueBox.classList.remove("show");
}

function scheduleHideUI() {

    clearTimeout(uiTimer);

    uiTimer = setTimeout(() => {

        /*
         * ซ่อน NOW PLAYING แยกจาก UI หลัก
         */
        hideNowPlaying();

        /*
         * ซ่อน UI บนจอ
         */
        hideUI();

    }, 8000);
}


/* =========================================================
   NOW PLAYING
========================================================= */

function showNowPlaying(title) {

    clearTimeout(uiTimer);

    nowTitle.textContent =
        title || "กำลังเล่นเพลง";

    nowPlaying.classList.add("show");

    /*
     * สำคัญ:
     * ตั้ง timer ใหม่ทุกครั้งที่เริ่มเพลง
     * ทำให้ NOW PLAYING ไม่ค้าง
     */
    uiTimer = setTimeout(() => {

        hideNowPlaying();

        /*
         * หลัง NOW PLAYING หาย
         * ซ่อนส่วนควบคุมอื่นด้วย
         */
        hideUI();

    }, 8000);
}

function hideNowPlaying() {

    nowPlaying.classList.remove("show");
}


/* =========================================================
   STATUS
========================================================= */

function setOnlineStatus(online) {

    if (online) {

        statusDot.classList.add("online");

        statusText.textContent =
            "พร้อมใช้งาน";

    } else {

        statusDot.classList.remove("online");

        statusText.textContent =
            "กำลังเชื่อมต่อ...";
    }
}


/* =========================================================
   ROOM
========================================================= */

function createRoomId() {

    return (
        "room_" +
        Math.random()
            .toString(36)
            .substring(2, 7)
    );
}

function initRoom() {

    currentRoom =
        sessionStorage.getItem("k_room");

    if (!currentRoom) {

        currentRoom =
            createRoomId();

        sessionStorage.setItem(
            "k_room",
            currentRoom
        );
    }

    createQRCode();

    initPeer();
}


/* =========================================================
   QR CODE
========================================================= */

function createQRCode() {

    qrCode.innerHTML = "";

    const controllerUrl =
        window.location.origin +
        window.location.pathname
            .replace("display.html", "controller.html") +
        "?room=" +
        encodeURIComponent(currentRoom);

    new QRCode(qrCode, {
        text: controllerUrl,
        width: 130,
        height: 130,
        correctLevel: QRCode.CorrectLevel.M
    });
}


/* =========================================================
   PEERJS
========================================================= */

function initPeer() {

    setOnlineStatus(false);

    peer = new Peer(currentRoom);

    peer.on("open", id => {

        console.log(
            "Peer opened:",
            id
        );

        setOnlineStatus(true);
    });

    peer.on("connection", conn => {

        console.log(
            "Controller connected:",
            conn.peer
        );

        /*
         * ใช้ connection ล่าสุด
         */
        connObj = conn;

        setupConnection(conn);

    });

    peer.on("error", error => {

        console.error(
            "Peer error:",
            error
        );

        setOnlineStatus(false);

    });

    peer.on("disconnected", () => {

        setOnlineStatus(false);

        /*
         * พยายาม reconnect
         */
        try {
            peer.reconnect();
        } catch (e) {
            console.error(e);
        }

    });
}

function setupConnection(conn) {

    conn.on("open", () => {

        console.log(
            "Controller connection opened"
        );

        setOnlineStatus(true);

        syncQueue();
    });

    conn.on("data", data => {

        console.log(
            "COMMAND:",
            data
        );

        handleCommand(data);
    });

    conn.on("close", () => {

        console.log(
            "Controller disconnected"
        );

        if (connObj === conn) {
            connObj = null;
        }
    });

    conn.on("error", error => {

        console.error(
            "Connection error:",
            error
        );

    });
}


/* =========================================================
   COMMAND HANDLER
========================================================= */

function handleCommand(data) {

    if (!data || !data.type) {
        return;
    }

    switch (data.type) {

        case "ADD_SONG":
            addSongFromController(data.song);
            break;

        case "SKIP":
            skipSong();
            break;

        case "TOGGLE_PLAY":
            togglePlayFromController();
            break;

        case "DELETE_SONG":
            deleteSong(data.index);
            break;

        case "MOVE_SONG":
            moveSong(
                data.index,
                data.direction
            );
            break;

        case "RETRY_PLAY":
            retryPlay();
            break;

        default:
            console.log(
                "Unknown command:",
                data.type
            );
    }
}


/* =========================================================
   ADD SONG
========================================================= */

function addSongFromController(song) {

    if (!song) {
        return;
    }

    if (!song.videoId) {
        return;
    }

    /*
     * ป้องกันเพลงซ้ำ
     */
    const duplicate =
        queue.some(
            item =>
                item.videoId === song.videoId
        );

    if (duplicate) {

        console.log(
            "Song already in queue"
        );

        return;
    }

    queue.push(song);

    console.log(
        "Added song:",
        song
    );

    syncQueue();

    /*
     * ถ้าเป็นเพลงแรก
     * และ YouTube พร้อมแล้ว
     * ให้เริ่มเล่นทันที
     */
    if (
        queue.length === 1 &&
        isAppReady &&
        player
    ) {

        playCurrent();
    }

    /*
     * ถ้ามีเพลงกำลังเล่นอยู่
     * การเพิ่มเพลงใหม่จะไม่แตะ NOW PLAYING
     */
}


/* =========================================================
   QUEUE SYNC
========================================================= */

function syncQueue() {

    updateQueueUI();

    if (
        connObj &&
        connObj.open
    ) {

        try {

            connObj.send({
                type: "QUEUE_UPDATE",
                queue: queue
            });

        } catch (error) {

            console.error(
                "Queue sync error:",
                error
            );
        }
    }
}


/* =========================================================
   QUEUE UI
========================================================= */

function updateQueueUI() {

    queueList.innerHTML = "";

    queueCount.textContent =
        queue.length;

    if (queue.length === 0) {

        queueBox.classList.remove("show");

        return;
    }

    /*
     * แสดง queue
     */
    queue.forEach((song, index) => {

        const item =
            document.createElement("div");

        item.className =
            "queue-item";

        if (index === 0) {
            item.classList.add("current");
        }

        const number =
            document.createElement("div");

        number.className =
            "queue-number";

        number.textContent =
            index === 0
                ? "▶"
                : index;

        const title =
            document.createElement("div");

        title.className =
            "queue-title";

        title.textContent =
            song.title || "ไม่ทราบชื่อเพลง";

        item.appendChild(number);
        item.appendChild(title);

        queueList.appendChild(item);
    });

    /*
     * แสดง queue เฉพาะช่วง UI ยังเปิด
     */
    if (
        nowPlaying.classList.contains("show")
    ) {

        queueBox.classList.add("show");
    }
}


/* =========================================================
   DELETE SONG
========================================================= */

function deleteSong(index) {

    if (
        typeof index !== "number" ||
        index < 0 ||
        index >= queue.length
    ) {
        return;
    }

    /*
     * ลบเพลงปัจจุบัน
     */
    if (index === 0) {

        queue.shift();

        clearTimeout(scoreTimer);

        hideScore();

        if (queue.length > 0) {

            syncQueue();

            playCurrent();

        } else {

            syncQueue();

            showIdleScreen();
        }

        return;
    }

    /*
     * ลบเพลงที่อยู่ในคิว
     */
    queue.splice(index, 1);

    syncQueue();
}


/* =========================================================
   MOVE SONG
========================================================= */

function moveSong(index, direction) {

    if (
        typeof index !== "number" ||
        index <= 0 ||
        index >= queue.length
    ) {
        return;
    }

    const newIndex =
        direction === "up"
            ? index - 1
            : index + 1;

    if (
        newIndex <= 0 ||
        newIndex >= queue.length
    ) {
        return;
    }

    const temp =
        queue[index];

    queue[index] =
        queue[newIndex];

    queue[newIndex] =
        temp;

    syncQueue();
}


/* =========================================================
   MANUAL SKIP
========================================================= */

function skipSong() {

    if (queue.length === 0) {

        showIdleScreen();

        return;
    }

    /*
     * ยกเลิก transition เดิม
     */
    transitionLock = true;

    clearTimeout(scoreTimer);

    hideScore();

    stopScoreWatcher();

    /*
     * เอาเพลงปัจจุบันออก
     */
    queue.shift();

    syncQueue();

    if (queue.length > 0) {

        transitionLock = false;

        playCurrent();

    } else {

        transitionLock = false;

        showIdleScreen();
    }
}


/* =========================================================
   PLAY CURRENT
========================================================= */

function playCurrent() {

    if (!player) {
        return;
    }

    if (queue.length === 0) {

        showIdleScreen();

        return;
    }

    /*
     * เพลงใหม่เริ่มเล่น
     * ปลด lock
     */
    transitionLock = false;

    stopBackgroundRotation();

    emptyState.style.display =
        "none";

    playerWrapper.style.display =
        "flex";

    const song =
        queue[0];

    const title =
        song.title ||
        "กำลังเล่นเพลง";

    /*
     * แสดง NOW PLAYING ใหม่
     */
    showNowPlaying(title);

    /*
     * แสดง queue ชั่วคราว
     */
    queueBox.classList.add("show");

    /*
     * โหลดและเล่นเพลง
     */
    try {

        player.loadVideoById(
            song.videoId
        );

    } catch (error) {

        console.error(
            "loadVideoById error:",
            error
        );

        handlePlayerError();
    }

    /*
     * ปิด caption
     */
    setTimeout(() => {
        disableYouTubeCaptions();
    }, 500);

    setTimeout(() => {
        disableYouTubeCaptions();
    }, 2000);

    updateQueueUI();
}


/* =========================================================
   IDLE SCREEN
========================================================= */

function showIdleScreen() {

    console.log(
        "SHOW IDLE SCREEN"
    );

    clearTimeout(uiTimer);
    clearTimeout(scoreTimer);

    transitionLock = false;

    hideScore();

    hideNowPlaying();

    stopScoreWatcher();

    /*
     * หยุด player
     */
    if (player) {

        try {
            player.stopVideo();
        } catch (e) {
            console.log(e);
        }
    }

    /*
     * ซ่อน player
     */
    playerWrapper.style.display =
        "none";

    /*
     * แสดง idle screen
     */
    emptyState.style.display =
        "flex";

    /*
     * ซ่อนข้อมูลเพลง
     */
    nowTitle.textContent = "";

    queueBox.classList.remove("show");

    /*
     * QR ยังแสดง
     */
    qrPanel.classList.remove("hidden");

    /*
     * เปิด background
     */
    startBackgroundRotation();

    showUI();

    /*
     * บังคับ update queue
     */
    updateQueueUI();
}


/* =========================================================
   TOGGLE PLAY
========================================================= */

function togglePlayFromController() {

    if (!player) {
        return;
    }

    const state =
        player.getPlayerState();

    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    } else {

        player.playVideo();
    }
}


/* =========================================================
   RETRY
========================================================= */

function retryPlay() {

    if (
        queue.length === 0 ||
        !player
    ) {
        return;
    }

    transitionLock = false;

    playCurrent();
}


/* =========================================================
   YOUTUBE CAPTIONS
========================================================= */

function disableYouTubeCaptions() {

    if (!player) {
        return;
    }

    try {

        if (
            typeof player.unloadModule ===
            "function"
        ) {

            try {
                player.unloadModule(
                    "captions"
                );
            } catch (e) {}
        }

        if (
            typeof player.setOption ===
            "function"
        ) {

            try {

                player.setOption(
                    "captions",
                    "track",
                    {}
                );

            } catch (e) {}
        }

    } catch (error) {

        console.log(
            "Disable YouTube captions:",
            error
        );
    }
}


/* =========================================================
   YOUTUBE STATE CHANGE
========================================================= */

function onPlayerStateChange(event) {

    if (!window.YT || !YT.PlayerState) {
        return;
    }

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        console.log(
            "YouTube PLAYING"
        );

        disableYouTubeCaptions();

        /*
         * NOW PLAYING จะถูกซ่อนตาม timer
         */
        startScoreWatcher();

    } else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        console.log(
            "YouTube PAUSED"
        );

        /*
         * ตอน pause ให้แสดง UI
         */
        showUI();

        stopScoreWatcher();

    } else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        console.log(
            "YouTube ENDED"
        );

        /*
         * สำคัญที่สุด:
         * ห้ามตั้ง isEnding แล้วไปบล็อก
         * การเปลี่ยนเพลง
         */
        finishCurrentSong();
    }
}


/* =========================================================
   FINISH CURRENT SONG
========================================================= */

function finishCurrentSong() {

    /*
     * ป้องกัน ENDED ถูกยิงซ้ำ
     */
    if (transitionLock) {

        console.log(
            "finishCurrentSong ignored - locked"
        );

        return;
    }

    transitionLock = true;

    console.log(
        "Finishing:",
        queue[0]
    );

    stopScoreWatcher();

    clearTimeout(uiTimer);

    /*
     * เอาเพลงที่จบออกจาก queue ทันที
     */
    if (queue.length > 0) {
        queue.shift();
    }

    /*
     * แจ้ง controller ทันทีว่า
     * เพลงปัจจุบันออกจาก queue แล้ว
     */
    syncQueue();

    /*
     * แสดงคะแนน
     */
    showScore();

    /*
     * รอแสดงคะแนน
     * แล้วค่อยไปเพลงถัดไป
     */
    clearTimeout(scoreTimer);

    scoreTimer = setTimeout(() => {

        hideScore();

        if (queue.length > 0) {

            console.log(
                "Playing next queued song"
            );

            transitionLock = false;

            playCurrent();

        } else {

            console.log(
                "Queue empty - returning to idle screen"
            );

            transitionLock = false;

            showIdleScreen();
        }

    }, 3500);
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(event) {

    console.error(
        "YouTube Player Error:",
        event.data
    );

    /*
     * ป้องกัน error ขณะกำลังเปลี่ยนเพลง
     */
    if (transitionLock) {
        return;
    }

    /*
     * ถ้ามี queue
     * ให้ข้ามเพลงที่มีปัญหา
     */
    handlePlayerError();
}

function handlePlayerError() {

    if (transitionLock) {
        return;
    }

    transitionLock = true;

    clearTimeout(uiTimer);

    stopScoreWatcher();

    setTimeout(() => {

        if (queue.length > 0) {

            /*
             * เอาเพลงที่เล่นไม่ได้ออก
             */
            queue.shift();

            syncQueue();

            if (queue.length > 0) {

                transitionLock = false;

                playCurrent();

            } else {

                transitionLock = false;

                showIdleScreen();
            }

        } else {

            transitionLock = false;

            showIdleScreen();
        }

    }, 1500);
}


/* =========================================================
   YOUTUBE READY
========================================================= */

function onPlayerReady() {

    console.log(
        "YouTube Player READY"
    );

    isAppReady = true;

    disableYouTubeCaptions();

    /*
     * ถ้ามีเพลงค้างอยู่
     * ให้เล่น
     */
    if (queue.length > 0) {

        playCurrent();

    } else {

        showIdleScreen();
    }
}


/* =========================================================
   SCORE WATCHER
========================================================= */

let scoreWatcher = null;

function startScoreWatcher() {

    stopScoreWatcher();

    scoreWatcher =
        setInterval(() => {

            if (!player) {
                return;
            }

            try {

                const duration =
                    player.getDuration();

                const current =
                    player.getCurrentTime();

                if (
                    duration > 0 &&
                    current > 0 &&
                    duration - current <= 5
                ) {

                    showScore();

                    stopScoreWatcher();
                }

            } catch (e) {}

        }, 500);
}

function stopScoreWatcher() {

    if (scoreWatcher) {

        clearInterval(
            scoreWatcher
        );

        scoreWatcher = null;
    }
}


/* =========================================================
   SCORE
========================================================= */

function showScore() {

    /*
     * ป้องกัน score ขึ้นซ้ำ
     */
    clearTimeout(scoreTimer);

    const score =
        Math.floor(
            Math.random() * 21
        ) + 80;

    scoreNumber.textContent =
        score;

    let message =
        "เยี่ยมมาก!";

    if (score >= 98) {
        message = "สุดยอดมาก! 🔥";
    } else if (score >= 95) {
        message = "ร้องได้ยอดเยี่ยม!";
    } else if (score >= 90) {
        message = "เสียงดีมาก!";
    } else if (score >= 85) {
        message = "ทำได้ดีครับ!";
    } else {
        message = "เกือบสมบูรณ์แบบ!";
    }

    scoreMessage.textContent =
        message;

    scoreOverlay.classList.add("show");
}

function hideScore() {

    scoreOverlay.classList.remove(
        "show"
    );
}


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube API Ready"
    );

    player =
        new YT.Player(
            "player",
            {
                width: "100%",
                height: "100%",

                videoId: "",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    disablekb: 1,

                    fs: 0,

                    modestbranding: 1,

                    rel: 0,

                    iv_load_policy: 3,

                    cc_load_policy: 0,

                    playsinline: 1,

                    origin:
                        window.location.origin
                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError
                }
            }
        );
}


/* =========================================================
   LOAD YOUTUBE API
========================================================= */

(function loadYouTubeAPI() {

    const tag =
        document.createElement("script");

    tag.src =
        "https://www.youtube.com/iframe_api";

    const firstScript =
        document.getElementsByTagName(
            "script"
        )[0];

    firstScript.parentNode.insertBefore(
        tag,
        firstScript
    );

})();


/* =========================================================
   INITIAL APP
========================================================= */

function initApp() {

    console.log(
        "Initializing Napat Karaoke Pro..."
    );

    startOverlay.style.display =
        "none";

    /*
     * ตั้ง background แรก
     */
    document.getElementById(

}
