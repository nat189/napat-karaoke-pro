<!DOCTYPE html><html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Napat Karaoke Pro - TV</title><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
}

/* =========================================================
   BACKGROUND
========================================================= */

#background {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: #000;
    overflow: hidden;
}

.bg-layer {
    position: absolute;
    inset: 0;

    background-size: cover;
    background-position: center;

    opacity: 0;

    transition: opacity 1.2s ease;
}

.bg-layer.active {
    opacity: 1;
}

#background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.15),
            rgba(0,0,0,.60)
        );
}

/* =========================================================
   YOUTUBE PLAYER
========================================================= */

#player-wrapper {
    position: absolute;
    inset: 0;

    z-index: 5;

    display: none;

    background: #000;
}

#player {
    width: 100%;
    height: 100%;
}

#player iframe {
    width: 100% !important;
    height: 100% !important;
}

/* =========================================================
   TOP BAR
========================================================= */

#top-bar {
    position: absolute;

    top: 20px;
    left: 25px;
    right: 25px;

    z-index: 50;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

#brand,
#room-info {
    padding: 10px 17px;

    border-radius: 14px;

    background: rgba(0,0,0,.60);

    backdrop-filter: blur(8px);
}

#brand {
    font-size: 21px;
    font-weight: bold;
}

#room-info {
    font-size: 17px;
}

/* =========================================================
   NOW PLAYING
========================================================= */

#now-playing {
    position: absolute;

    top: 85px;
    left: 50%;

    z-index: 60;

    min-width: 400px;
    max-width: 80vw;

    padding: 13px 25px;

    text-align: center;

    border-radius: 18px;

    background: rgba(0,0,0,.75);

    border: 1px solid rgba(255,255,255,.15);

    opacity: 0;
    visibility: hidden;

    transform:
        translateX(-50%)
        translateY(-15px);

    transition:
        opacity .35s ease,
        transform .35s ease,
        visibility .35s ease;

    pointer-events: none;
}

#now-playing.show {
    opacity: 1;
    visibility: visible;

    transform:
        translateX(-50%)
        translateY(0);
}

#now-playing-label {
    font-size: 15px;
    opacity: .75;
    margin-bottom: 5px;
}

#now-title {
    font-size: 27px;
    font-weight: bold;
    line-height: 1.25;
}

/* =========================================================
   QUEUE
========================================================= */

#queue-box {
    position: absolute;

    right: 25px;
    bottom: 25px;

    z-index: 55;

    width: 360px;
    max-height: 55vh;

    padding: 17px;

    border-radius: 18px;

    background: rgba(0,0,0,.74);

    backdrop-filter: blur(10px);

    opacity: 0;
    visibility: hidden;

    transition: opacity .3s ease;
}

#queue-box.show {
    opacity: 1;
    visibility: visible;
}

#queue-title {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 10px;
}

#queue-list {
    max-height: calc(55vh - 55px);
    overflow: hidden;
}

.queue-item {
    display: flex;
    align-items: center;

    gap: 9px;

    padding: 8px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.12);
}

.queue-item:last-child {
    border-bottom: none;
}

.queue-number {
    width: 28px;

    text-align: center;

    font-weight: bold;
}

.queue-name {
    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.queue-current {
    color: #00ff99;
}

/* =========================================================
   QR
========================================================= */

#qr-box {
    position: absolute;

    left: 25px;
    bottom: 25px;

    z-index: 55;

    width: 210px;

    padding: 13px;

    border-radius: 18px;

    background: rgba(255,255,255,.96);

    color: #111;

    text-align: center;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);
}

#qrcode {
    width: 180px;
    height: 180px;

    margin: auto;
}

#qrcode img,
#qrcode canvas {
    display: block;

    width: 180px !important;
    height: 180px !important;

    margin: auto;
}

#qr-label {
    margin-top: 8px;

    font-size: 14px;
    font-weight: bold;
}

#qr-url {
    margin-top: 4px;

    font-size: 9px;

    word-break: break-all;

    opacity: .60;
}

/* =========================================================
   IDLE SCREEN
========================================================= */

#empty-state {
    position: absolute;
    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    pointer-events: none;
}

#empty-content {
    margin-top: -30px;
}

#empty-main {
    font-size: 48px;

    font-weight: bold;

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.8);
}

#empty-sub {
    margin-top: 12px;

    font-size: 21px;

    opacity: .85;
}

/* =========================================================
   SCORE
========================================================= */

#score-overlay {
    position: absolute;
    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.40);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .35s ease;
}

#score-overlay.show {
    opacity: 1;
    visibility: visible;
}

#score-card {
    min-width: 420px;

    padding: 35px 50px;

    border-radius: 30px;

    background:
        rgba(0,0,0,.82);

    backdrop-filter: blur(12px);

    text-align: center;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.65);
}

#score-label {
    font-size: 25px;

    font-weight: bold;

    margin-bottom: 10px;
}

#score-number {
    font-size: 105px;

    line-height: 1;

    font-weight: 900;
}

#score-message {
    margin-top: 12px;

    font-size: 24px;
}

/* =========================================================
   START SCREEN
========================================================= */

#start-overlay {
    position: absolute;
    inset: 0;

    z-index: 200;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.78);
}

#start-button {
    padding: 20px 42px;

    border: none;

    border-radius: 18px;

    background: #fff;

    color: #111;

    font-size: 27px;

    font-weight: bold;

    cursor: pointer;
}

#start-button:active {
    transform: scale(.97);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    #brand {
        font-size: 17px;
    }

    #room-info {
        font-size: 14px;
    }

    #queue-box {
        width: 300px;

        right: 15px;
        bottom: 15px;
    }

    #qr-box {
        left: 15px;
        bottom: 15px;

        transform: scale(.85);

        transform-origin:
            bottom left;
    }

    #now-playing {
        min-width: 300px;
    }

    #now-title {
        font-size: 21px;
    }

    #score-card {
        min-width: 320px;

        padding: 30px;
    }
}

</div><script>
"use strict";

/* =========================================================
   STATE
========================================================= */

let peer = null;

let connObj = null;

let currentRoom = "";

let queue = [];

let player = null;

let isAppReady = false;

let transitionLock = false;

let uiTimer = null;

let scoreTimer = null;

let bgTimer = null;

let bgIndex = 0;

let activeBg = 1;

let scoreWatcher = null;


/* =========================================================
   DOM
========================================================= */

const roomIdEl =
    document.getElementById(
        "room-id"
    );

const playerWrapper =
    document.getElementById(
        "player-wrapper"
    );

const nowPlaying =
    document.getElementById(
        "now-playing"
    );

const nowTitle =
    document.getElementById(
        "now-title"
    );

const queueBox =
    document.getElementById(
        "queue-box"
    );

const queueList =
    document.getElementById(
        "queue-list"
    );

const emptyState =
    document.getElementById(
        "empty-state"
    );

const scoreOverlay =
    document.getElementById(
        "score-overlay"
    );

const scoreNumber =
    document.getElementById(
        "score-number"
    );

const scoreMessage =
    document.getElementById(
        "score-message"
    );

const startOverlay =
    document.getElementById(
        "start-overlay"
    );

const startButton =
    document.getElementById(
        "start-button"
    );

const qrcodeEl =
    document.getElementById(
        "qrcode"
    );

const qrUrlEl =
    document.getElementById(
        "qr-url"
    );

const bg1 =
    document.getElementById(
        "bg1"
    );

const bg2 =
    document.getElementById(
        "bg2"
    );


/* =========================================================
   BACKGROUND
========================================================= */

const backgrounds = [

    "https://picsum.photos/id/1011/1920/1080",

    "https://picsum.photos/id/1015/1920/1080",

    "https://picsum.photos/id/1016/1920/1080",

    "https://picsum.photos/id/1025/1920/1080",

    "https://picsum.photos/id/1039/1920/1080"

];


function startBackgroundRotation() {

    clearInterval(bgTimer);

    bgIndex = 0;

    bg1.style.backgroundImage =
        `url("${backgrounds[0]}")`;

    bg2.style.backgroundImage =
        `url("${backgrounds[1]}")`;

    bg1.classList.add("active");

    bg2.classList.remove("active");

    activeBg = 1;

    bgTimer = setInterval(() => {

        bgIndex++;

        if (
            bgIndex >=
            backgrounds.length
        ) {
            bgIndex = 0;
        }

        if (activeBg === 1) {

            bg2.style.backgroundImage =
                `url("${backgrounds[bgIndex]}")`;

            bg2.classList.add("active");

            bg1.classList.remove("active");

            activeBg = 2;

        } else {

            bg1.style.backgroundImage =
                `url("${backgrounds[bgIndex]}")`;

            bg1.classList.add("active");

            bg2.classList.remove("active");

            activeBg = 1;
        }

    }, 10000);
}


/* =========================================================
   UI
========================================================= */

function showNowPlaying(title) {

    clearTimeout(uiTimer);

    nowTitle.textContent =
        title ||
        "กำลังเล่นเพลง";

    nowPlaying.classList.add(
        "show"
    );

    /*
       NOW PLAYING แสดง 8 วินาที
    */

    uiTimer =
        setTimeout(() => {

            nowPlaying.classList.remove(
                "show"
            );

        }, 8000);
}


function hideNowPlaying() {

    clearTimeout(uiTimer);

    nowPlaying.classList.remove(
        "show"
    );
}


function showQueue() {

    if (queue.length > 0) {

        queueBox.classList.add(
            "show"
        );

    } else {

        queueBox.classList.remove(
            "show"
        );
    }
}


function hideQueue() {

    queueBox.classList.remove(
        "show"
    );
}


/* =========================================================
   IDLE
========================================================= */

function showIdleScreen() {

    clearTimeout(uiTimer);

    clearTimeout(scoreTimer);

    stopScoreWatcher();

    transitionLock = false;

    hideNowPlaying();

    hideQueue();

    scoreOverlay.classList.remove(
        "show"
    );

    emptyState.style.display =
        "flex";

    playerWrapper.style.display =
        "none";

    startBackgroundRotation();

    if (player) {

        try {

            player.stopVideo();

        } catch (e) {

            console.warn(
                "stopVideo:",
                e
            );
        }
    }
}


/* =========================================================
   QR CODE
========================================================= */

function createControllerQR() {

    if (!currentRoom) {

        console.warn(
            "QR: room ยังไม่มี"
        );

        return;
    }

    /*
       =====================================================
       สำคัญมาก
       =====================================================

       QR ของ TV ต้องชี้ไป controller.html

       ตัวอย่าง:

       https://your-site.pages.dev/controller.html?room=ROOM_ABCDE

       ห้ามใช้:
       location.href
       location.pathname
       display.html
    */

    const controllerUrl =
        `${window.location.origin}/controller.html?room=${encodeURIComponent(currentRoom)}`;

    console.log(
        "================================"
    );

    console.log(
        "CONTROLLER QR URL:"
    );

    console.log(
        controllerUrl
    );

    console.log(
        "================================"
    );

    qrcodeEl.innerHTML = "";

    new QRCode(
        qrcodeEl,
        {
            text: controllerUrl,

            width: 180,

            height: 180,

            correctLevel:
                QRCode.CorrectLevel.M
        }
    );

    qrUrlEl.textContent =
        controllerUrl;
}


/* =========================================================
   ROOM ID
========================================================= */

function generateRoomId() {

    return (
        "room_" +
        Math.random()
            .toString(36)
            .substring(2, 7)
            .toUpperCase()
    );
}


/* =========================================================
   PEER ROOM
========================================================= */

function initRoom() {

    currentRoom =
        sessionStorage.getItem(
            "k_room"
        );

    if (!currentRoom) {

        currentRoom =
            generateRoomId();

        sessionStorage.setItem(
            "k_room",
            currentRoom
        );
    }

    roomIdEl.textContent =
        currentRoom;

    /*
       สร้าง QR ทันที
    */

    createControllerQR();


    /*
       สร้าง Peer ด้วย ROOM ID
    */

    peer =
        new Peer(
            currentRoom
        );


    peer.on(
        "open",
        id => {

            console.log(
                "Peer opened:",
                id
            );

            currentRoom = id;

            sessionStorage.setItem(
                "k_room",
                id
            );

            roomIdEl.textContent =
                id;

            /*
               สร้าง QR ใหม่อีกครั้ง
               เพื่อให้ตรงกับ Peer ID จริง
            */

            createControllerQR();
        }
    );


    /*
       Controller มือถือเชื่อมเข้ามา
    */

    peer.on(
        "connection",
        conn => {

            console.log(
                "Controller connected:",
                conn.peer
            );

            connObj = conn;


            conn.on(
                "open",
                () => {

                    console.log(
                        "Controller connection opened"
                    );

                    sendQueueUpdate();
                }
            );


            conn.on(
                "data",
                data => {

                    console.log(
                        "COMMAND:",
                        data
                    );

                    handleCommand(
                        data
                    );
                }
            );


            conn.on(
                "close",
                () => {

                    console.log(
                        "Controller disconnected"
                    );

                    if (
                        connObj === conn
                    ) {

                        connObj = null;
                    }
                }
            );


            conn.on(
                "error",
                error => {

                    console.error(
                        "Connection error:",
                        error
                    );

                    if (
                        connObj === conn
                    ) {

                        connObj = null;
                    }
                }
            );

        }
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Peer error:",
                error
            );

            /*
               Room ซ้ำ
            */

            if (
                error.type ===
                "unavailable-id"
            ) {

                console.warn(
                    "Room ID ซ้ำ กำลังสร้างใหม่..."
                );

                sessionStorage.removeItem(
                    "k_room"
                );

                setTimeout(
                    () => {
                        location.reload();
                    },
                    1000
                );
            }
        }
    );
}


/* =========================================================
   SEND QUEUE
========================================================= */

function sendQueueUpdate() {

    if (
        connObj &&
        connObj.open
    ) {

        try {

            connObj.send({

                type:
                    "QUEUE_UPDATE",

                queue:
                    queue

            });

        } catch (error) {

            console.error(
                "QUEUE_UPDATE error:",
                error
            );
        }
    }
}


/* =========================================================
   SYNC QUEUE
========================================================= */

function syncQueue() {

    updateQueueUI();

    sendQueueUpdate();
}


/* =========================================================
   QUEUE UI
========================================================= */

function updateQueueUI() {

    queueList.innerHTML = "";

    if (queue.length === 0) {

        hideQueue();

        return;
    }

    showQueue();


    queue.forEach(
        (song, index) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "queue-item";


            if (index === 0) {

                item.classList.add(
                    "queue-current"
                );
            }


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "queue-number";

            number.textContent =
                index + 1;


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "queue-name";

            name.textContent =
                song.title ||
                "ไม่ทราบชื่อ";


            item.appendChild(
                number
            );

            item.appendChild(
                name
            );

            queueList.appendChild(
                item
            );
        }
    );
}


/* =========================================================
   COMMAND
========================================================= */

function handleCommand(data) {

    if (
        !data ||
        !data.type
    ) {
        return;
    }


    switch (
        data.type
    ) {

        case "ADD_SONG":

            addSong(
                data.song
            );

            break;


        case "SKIP":

            skipSong();

            break;


        case "TOGGLE_PLAY":

            togglePlay();

            break;


        case "DELETE_SONG":

            deleteSong(
                data.index
            );

            break;


        case "MOVE_SONG":

            moveSong(
                data.from,
                data.to
            );

            break;


        case "RETRY_PLAY":

            retryCurrentSong();

            break;


        default:

            console.warn(
                "Unknown command:",
                data.type
            );
    }
}


/* =========================================================
   ADD SONG
========================================================= */

function addSong(song) {

    if (
        !song ||
        !song.videoId
    ) {

        console.warn(
            "เพลงไม่ถูกต้อง:",
            song
        );

        return;
    }


    const newSong = {

        videoId:
            song.videoId,

        title:
            song.title ||
            "เพลงไม่ทราบชื่อ",

        thumbnail:
            song.thumbnail ||
            ""

    };


    queue.push(
        newSong
    );


    console.log(
        "เพิ่มเพลง:",
        newSong.title
    );


    syncQueue();


    /*
       ถ้าเป็นเพลงแรก
       ให้เล่นทันที
    */

    if (
        queue.length === 1 &&
        isAppReady &&
        player
    ) {

        playCurrent();
    }
}


/* =========================================================
   PLAY CURRENT
========================================================= */

function playCurrent() {

    if (
        !player ||
        queue.length === 0
    ) {

        if (
            queue.length === 0
        ) {

            showIdleScreen();
        }

        return;
    }


    clearTimeout(
        scoreTimer
    );

    hideScore();

    stopScoreWatcher();

    transitionLock = false;


    const song =
        queue[0];


    emptyState.style.display =
        "none";


    playerWrapper.style.display =
        "block";


    showNowPlaying(
        song.title
    );


    updateQueueUI();


    console.log(
        "PLAY:",
        song
    );


    try {

        player.loadVideoById(
            song.videoId
        );

    } catch (error) {

        console.error(
            "loadVideoById:",
            error
        );
    }
}


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube API Ready"
    );


    player =
        new YT.Player(
            "player",
            {

                width: "100%",

                height: "100%",


                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    rel: 0,

                    modestbranding: 1,

                    playsinline: 1
                },


                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError
                }
            }
        );
}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    console.log(
        "YouTube Player Ready"
    );

    isAppReady = true;


    if (
        queue.length > 0
    ) {

        playCurrent();
    }
}


/* =========================================================
   YOUTUBE STATE
========================================================= */

function onPlayerStateChange(
    event
) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        disableYouTubeCaptions();

        startScoreWatcher();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        showQueue();

        stopScoreWatcher();
    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        finishCurrentSong();
    }
}


/* =========================================================
   DISABLE CAPTIONS
========================================================= */

function disableYouTubeCaptions() {

    try {

        if (player) {

            player.unloadModule(
                "captions"
            );
        }

    } catch (error) {

        console.warn(
            "Caption:",
            error
        );
    }
}


/* =========================================================
   SONG FINISHED
========================================================= */

function finishCurrentSong() {

    /*
       ป้องกัน END ซ้ำ
    */

    if (
        transitionLock
    ) {

        return;
    }


    transitionLock = true;


    clearTimeout(
        uiTimer
    );

    stopScoreWatcher();


    /*
       เอาเพลงปัจจุบันออกจากคิว
    */

    if (
        queue.length > 0
    ) {

        queue.shift();
    }


    /*
       ส่งคิวใหม่ให้มือถือ
    */

    syncQueue();


    /*
       แสดงคะแนน
       เป็นเวลา 8 วินาที
    */

    showScore();


    clearTimeout(
        scoreTimer
    );


    scoreTimer =
        setTimeout(
            () => {

                hideScore();


                /*
                   มีเพลงต่อ
                */

                if (
                    queue.length > 0
                ) {

                    transitionLock =
                        false;

                    playCurrent();

                }


                /*
                   ไม่มีเพลงต่อ
                */

                else {

                    transitionLock =
                        false;

                    showIdleScreen();
                }

            },

            8000
        );
}


/* =========================================================
   SKIP
========================================================= */

function skipSong() {

    clearTimeout(
        scoreTimer
    );

    clearTimeout(
        uiTimer
    );

    stopScoreWatcher();

    hideScore();

    hideNowPlaying();


    if (
        queue.length === 0
    ) {

        showIdleScreen();

        return;
    }


    transitionLock = true;


    /*
       ข้ามเพลงปัจจุบัน
    */

    queue.shift();


    syncQueue();


    if (
        queue.length > 0
    ) {

        transitionLock =
            false;

        playCurrent();

    } else {

        transitionLock =
            false;

        showIdleScreen();
    }
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

    if (!player) {
        return;
    }


    try {

        const state =
            player.getPlayerState();


        if (
            state ===
            YT.PlayerState.PLAYING
        ) {

            player.pauseVideo();

        } else {

            player.playVideo();
        }

    } catch (error) {

        console.error(
            "Toggle:",
            error
        );
    }
}


/* =========================================================
   DELETE SONG
========================================================= */

function deleteSong(index) {

    if (
        typeof index !== "number"
    ) {
        return;
    }


    if (
        index < 0 ||
        index >= queue.length
    ) {
        return;
    }


    /*
       ลบเพลงปัจจุบัน
    */

    if (
        index === 0
    ) {

        clearTimeout(
            scoreTimer
        );

        clearTimeout(
            uiTimer
        );

        stopScoreWatcher();


        queue.shift();


        syncQueue();


        if (
            queue.length > 0
        ) {

            playCurrent();

        } else {

            showIdleScreen();
        }


        return;
    }


    /*
       ลบเพลงที่อยู่ในคิว
    */

    queue.splice(
        index,
        1
    );


    syncQueue();
}


/* =========================================================
   MOVE SONG
========================================================= */

function moveSong(
    from,
    to
) {

    if (
        typeof from !== "number" ||
        typeof to !== "number"
    ) {
        return;
    }


    /*
       ห้ามย้ายเพลงปัจจุบัน
    */

    if (
        from <= 0 ||
        to <= 0 ||
        from >= queue.length ||
        to >= queue.length
    ) {

        return;
    }


    const song =
        queue.splice(
            from,
            1
        )[0];


    queue.splice(
        to,
        0,
        song
    );


    syncQueue();
}


/* =========================================================
   RETRY
========================================================= */

function retryCurrentSong() {

    if (
        queue.length === 0 ||
        !player
    ) {

        return;
    }


    playCurrent();
}


/* =========================================================
   PLAYER ERROR
========================================================= */

function onPlayerError(
    event
) {

    console.error(
        "YouTube Error:",
        event.data
    );


    stopScoreWatcher();


    /*
       ลบเพลงที่เปิดไม่ได้
    */

    setTimeout(
        () => {

            if (
                queue.length === 0
            ) {

                showIdleScreen();

                return;
            }


            queue.shift();

            syncQueue();


            if (
                queue.length > 0
            ) {

                playCurrent();

            } else {

                showIdleScreen();
            }

        },

        1500
    );
}


/* =========================================================
   SCORE WATCHER
========================================================= */

function startScoreWatcher() {

    stopScoreWatcher();


    scoreWatcher =
        setInterval(
            () => {

                if (
                    !player ||
                    queue.length === 0 ||
                    transitionLock
                ) {

                    return;
                }


                try {

                    const duration =
                        player.getDuration();


                    const current =
                        player.getCurrentTime();


                    /*
                       แสดงคะแนนในช่วง
                       5 วินาทีสุดท้าย
                    */

                    if (
                        duration > 0 &&
                        duration - current <= 5 &&
                        duration - current > 0
                    ) {

                        showScore();

                        stopScoreWatcher();
                    }

                } catch (error) {

                    console.warn(
                        "Score watcher:",
                        error
                    );
                }

            },

            500
        );
}


/* =========================================================
   STOP SCORE WATCHER
========================================================= */

function stopScoreWatcher() {

    if (
        scoreWatcher
    ) {

        clearInterval(
            scoreWatcher
        );

        scoreWatcher = null;
    }
}


/* =========================================================
   SCORE
========================================================= */

function showScore() {

    const score =
        Math.floor(
            Math.random() * 21
        ) + 80;


    scoreNumber.textContent =
        score;


    if (
        score >= 95
    ) {

        scoreMessage.textContent =
            "สุดยอดมาก! 🔥";

    }

    else if (
        score >= 90
    ) {

        scoreMessage.textContent =
            "เยี่ยมมาก! 🎤";

    }

    else if (
        score >= 85
    ) {

        scoreMessage.textContent =
            "ทำได้ดีครับ 👍";

    }

    else {

        scoreMessage.textContent =
            "เก่งมากครับ 👏";
    }


    scoreOverlay.classList.add(
        "show"
    );
}


/* =========================================================
   HIDE SCORE
========================================================= */

function hideScore() {

    scoreOverlay.classList.remove(
        "show"
    );
}


/* =========================================================
   INIT APP
========================================================= */

function initApp() {

    startOverlay.style.display =
        "none";


    /*
       เริ่ม PeerJS
    */

    initRoom();


    /*
       เริ่ม Background
    */

    startBackgroundRotation();


    /*
       โหลด YouTube IFrame API
    */

    if (
        !window.YT ||
        !window.YT.Player
    ) {

        const script =
            document.createElement(
                "script"
            );

        script.src =
            "https://www.youtube.com/iframe_api";


        document.head.appendChild(
            script
        );

    } else {

        onYouTubeIframeAPIReady();
    }


    /*
       เริ่มต้นเป็น Idle
    */

    showIdleScreen();
}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener(
    "click",
    () => {

        initApp();

    }
);


/* =========================================================
   GLOBAL ERROR
========================================================= */

window.addEventListener(
    "error",
    event => {

        console.error(
            "Global error:",
            event.error ||
            event.message
        );
    }
);
