<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#08080a">
    <title>Napat Karaoke Pro - Single Screen</title>

    <style>
        :root {
            --red: #ff2d55;
            --green: #32d74b;
            --blue: #0a84ff;
            --orange: #ff9f0a;
            --dark: #070709;
            --card: #151518;
            --card2: #1c1c20;
            --border: rgba(255,255,255,.09);
            --muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            padding-bottom: 40px;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: min(850px, 100%);
            margin: 0 auto;
            padding: 14px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--red), #ff7048);
            font-size: 22px;
            box-shadow: 0 8px 25px rgba(255,45,85,.28);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 900;
        }

        .brand-sub {
            margin-top: 2px;
            color: var(--muted);
            font-size: 11px;
        }

        .badge-mode {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.06);
            border: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
        }

        /* PLAYER STAGE */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* อัตราส่วน 16:9 */
            border-radius: 18px;
            overflow: hidden;
            background: #000000;
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .player-wrapper iframe, 
        .player-wrapper #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card);
            color: var(--muted);
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        .player-placeholder.hidden {
            display: none !important;
        }

        /* CONTROLS */
        .main-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 9px;
            margin-bottom: 14px;
        }

        .control-btn {
            border: 0;
            border-radius: 16px;
            min-height: 48px;
            color: white;
            font-weight: 900;
            font-size: 13px;
            transition: transform .12s ease, opacity .12s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .control-btn:active {
            transform: scale(.97);
            opacity: .82;
        }

        .btn-skip {
            background: linear-gradient(135deg, var(--red), #ff7048);
        }

        .btn-pause {
            background: linear-gradient(135deg, #5856d6, #8b5cf6);
        }

        .btn-retry {
            background: var(--card2);
            border: 1px solid var(--border);
        }

        /* SEARCH */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 3px 9px;
            font-size: 14px;
            font-weight: 900;
        }

        .section-count {
            color: var(--green);
            font-size: 11px;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        #search-input {
            min-width: 0;
            flex: 1;
            padding: 14px 15px;
            border-radius: 14px;
            border: 1px solid #29292e;
            outline: none;
            background: #141416;
            color: white;
            font-size: 14px;
        }

        #search-input:focus {
            border-color: rgba(10,132,255,.7);
            box-shadow: 0 0 0 3px rgba(10,132,255,.08);
        }

        .btn-search {
            width: 85px;
            border: 0;
            border-radius: 14px;
            background: var(--blue);
            color: white;
            font-size: 13px;
            font-weight: 900;
        }

        /* RESULTS */
        #results {
            margin-top: 10px;
            max-height: 380px;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        .result-thumb {
            width: 78px;
            height: 52px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 9px;
            background: #000;
        }

        .result-info {
            min-width: 0;
            flex: 1;
        }

        .result-title {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.35;
        }

        .result-meta {
            margin-top: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: #777;
            font-size: 10px;
        }

        .btn-action-group {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        .btn-add, .btn-play-now {
            border: 0;
            padding: 9px 11px;
            border-radius: 11px;
            color: white;
            font-size: 11px;
            font-weight: 900;
        }

        .btn-add { background: var(--red); }
        .btn-play-now { background: #2c2c30; border: 1px solid var(--border); }

        /* QUEUE */
        .queue-card {
            overflow: hidden;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid var(--border);
        }

        #queue-list {
            padding: 7px;
        }

        .queue-empty {
            padding: 28px 10px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .queue-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px;
            margin-bottom: 6px;
            border-radius: 14px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(255,255,255,.05);
        }

        .queue-item.playing {
            background: rgba(50,215,75,.09);
            border-color: rgba(50,215,75,.28);
        }

        .queue-number {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #29292d;
            color: #aaa;
            font-size: 11px;
            font-weight: 900;
        }

        .playing .queue-number {
            background: var(--green);
            color: #000;
        }

        .queue-info {
            min-width: 0;
            flex: 1;
        }

        .queue-status {
            margin-bottom: 3px;
            color: var(--green);
            font-size: 9px;
            font-weight: 900;
        }

        .queue-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 12px;
            font-weight: 700;
        }

        .queue-channel {
            margin-top: 3px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: #666;
            font-size: 9px;
        }

        .queue-actions {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .queue-btn {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 9px;
            background: #29292d;
            color: white;
            font-size: 12px;
            font-weight: 900;
        }

        .queue-btn.orange { color: var(--orange); }
        .queue-btn.red { color: var(--red); }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 999;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 11px 16px;
            border-radius: 30px;
            background: rgba(25,25,28,.94);
            border: 1px solid rgba(255,255,255,.12);
            color: white;
            font-size: 12px;
            font-weight: 700;
            transition: opacity .25s ease, transform .25s ease;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .loading {
            padding: 25px 10px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        .error {
            padding: 20px;
            text-align: center;
            color: var(--red);
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <div class="brand-icon">🎤</div>
            <div>
                <div class="brand-title">Napat Karaoke Pro</div>
                <div class="brand-sub">Single Screen Edition</div>
            </div>
        </div>
        <div class="badge-mode">● หน้าจอเดียว</div>
    </header>

    <!-- PLAYER -->
    <div class="player-wrapper">
        <div id="player"></div>
        <div id="player-placeholder" class="player-placeholder">
            <div style="font-size: 40px; margin-bottom: 8px;">🎶</div>
            <div style="font-weight: 700; font-size: 15px; color: #fff;">ยังไม่มีเพลงกำลังเล่น</div>
            <div style="font-size: 12px; margin-top: 4px;">ค้นหาเพลงด้านล่างแล้วกด "เล่นเลย" หรือ "จอง"</div>
        </div>
    </div>

    <!-- CONTROLS -->
    <div class="main-controls">
        <button class="control-btn btn-skip" onclick="skipSong()">⏭️ ข้ามเพลง</button>
        <button id="pause-btn" class="control-btn btn-pause" onclick="togglePlay()">⏸️ หยุดชั่วคราว</button>
        <button class="control-btn btn-retry" onclick="retrySong()">🔄 ร้องใหม่</button>
    </div>

    <!-- SEARCH -->
    <div class="section-title">
        <span>🔎 ค้นหาเพลง</span>
        <span id="result-count" class="section-count"></span>
    </div>

    <div class="search-box">
        <input id="search-input" type="text" autocomplete="off" placeholder="พิมพ์ชื่อเพลง / ศิลปิน...">
        <button class="btn-search" onclick="searchMusic()">ค้นหา</button>
    </div>

    <div id="results"></div>

    <!-- QUEUE -->
    <div class="section-title">
        <span>🎶 คิวเพลง</span>
        <span id="queue-count" class="section-count">0 เพลง</span>
    </div>

    <div class="queue-card">
        <div id="queue-list">
            <div class="queue-empty">🎵 ยังไม่มีเพลงในคิว</div>
        </div>
    </div>
</div>

<div id="toast"></div>

<!-- โหลด YouTube API ทางตรง -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
    let player = null;
    let isPlayerReady = false;
    let currentQueue = [];
    let isPaused = false;
    let toastTimer = null;
    let pendingVideoId = null;

    // ทำงานเมื่อโหลด YouTube API เสร็จ
    window.onYouTubeIframeAPIReady = function() {
        player = new YT.Player('player', {
            height: '100%',
            width: '100%',
            playerVars: {
                autoplay: 1,
                controls: 1,
                rel: 0,
                modestbranding: 1,
                playsinline: 1
            },
            events: {
                'onReady': function() {
                    isPlayerReady = true;
                    if (pendingVideoId) {
                        loadAndPlay(pendingVideoId);
                        pendingVideoId = null;
                    }
                },
                'onStateChange': function(event) {
                    if (event.data === YT.PlayerState.ENDED) {
                        skipSong();
                    }
                }
            }
        });
    };

    function loadAndPlay(videoId) {
        if (!isPlayerReady || !player || typeof player.loadVideoById !== 'function') {
            pendingVideoId = videoId;
            return;
        }
        player.loadVideoById(videoId);
        isPaused = false;
        updatePauseButton();
    }

    function playCurrentSong() {
        const placeholder = document.getElementById('player-placeholder');
        if (currentQueue.length === 0) {
            placeholder.classList.remove('hidden');
            if (isPlayerReady && player && typeof player.stopVideo === 'function') {
                player.stopVideo();
            }
            renderQueue();
            return;
        }

        placeholder.classList.add('hidden');
        loadAndPlay(currentQueue[0].videoId);
        renderQueue();
    }

    function togglePlay() {
        if (!isPlayerReady || !player || currentQueue.length === 0) return;
        if (isPaused) {
            player.playVideo();
            isPaused = false;
        } else {
            player.pauseVideo();
            isPaused = true;
        }
        updatePauseButton();
    }

    function updatePauseButton() {
        const btn = document.getElementById("pause-btn");
        btn.innerText = isPaused ? "▶️ เล่นต่อ" : "⏸️ หยุดชั่วคราว";
    }

    function skipSong() {
        if (currentQueue.length === 0) return;
        currentQueue.shift();
        playCurrentSong();
        showToast("⏭️ ข้ามเพลงเรียบร้อย");
    }

    function retrySong() {
        if (!isPlayerReady || !player || currentQueue.length === 0) return;
        player.seekTo(0);
        player.playVideo();
        isPaused = false;
        updatePauseButton();
        showToast("🔄 เริ่มเพลงใหม่");
    }

    async function searchMusic() {
        const input = document.getElementById("search-input");
        const q = input.value.trim();
        if (!q) {
            input.focus();
            return;
        }

        const results = document.getElementById("results");
        const count = document.getElementById("result-count");

        results.innerHTML = '<div class="loading">🔎 กำลังค้นหาเพลง...</div>';
        count.innerText = "";

        try {
            const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            if (!data || data.success !== true || !Array.isArray(data.results)) {
                throw new Error(data?.error || "รูปแบบข้อมูลไม่ถูกต้อง");
            }

            const songs = data.results;
            count.innerText = `${songs.length} รายการ`;

            if (songs.length === 0) {
                results.innerHTML = '<div class="loading">😢 ไม่พบเพลง</div>';
                return;
            }

            results.innerHTML = songs.map(song => createResultHtml(song)).join("");
        } catch (error) {
            results.innerHTML = `<div class="error">❌ ค้นหาไม่สำเร็จ<br><small>${escapeHtml(error.message)}</small></div>`;
        }
    }

    function createResultHtml(song) {
        const safeSong = encodeURIComponent(JSON.stringify(song));
        const thumbnail = song.thumbnail || `https://i.ytimg.com/vi/${song.videoId}/mqdefault.jpg`;
        const channel = song.channel || song.author || "";
        const duration = song.duration ? ` • ${song.duration}` : "";

        return `
            <div class="result-item">
                <img class="result-thumb" src="${escapeHtml(thumbnail)}" loading="lazy">
                <div class="result-info">
                    <div class="result-title">${escapeHtml(song.title || "ไม่ทราบชื่อ")}</div>
                    <div class="result-meta">${escapeHtml(channel)}${escapeHtml(duration)}</div>
                </div>
                <div class="btn-action-group">
                    <button class="btn-play-now" data-song="${safeSong}" onclick="playImmediately(this)">▶ เล่นเลย</button>
                    <button class="btn-add" data-song="${safeSong}" onclick="addSongFromButton(this)">＋ จอง</button>
                </div>
            </div>
        `;
    }

    function addSongFromButton(button) {
        try {
            const song = JSON.parse(decodeURIComponent(button.dataset.song));
            addSong(song, false);
        } catch (e) {
            showToast("เพิ่มเพลงไม่สำเร็จ");
        }
    }

    function playImmediately(button) {
        try {
            const song = JSON.parse(decodeURIComponent(button.dataset.song));
            addSong(song, true);
        } catch (e) {
            showToast("เล่นเพลงไม่สำเร็จ");
        }
    }

    function addSong(song, playNow = false) {
        if (!song || !song.videoId) {
            showToast("เพลงนี้ไม่มี Video ID");
            return;
        }

        if (playNow) {
            currentQueue.unshift(song);
            playCurrentSong();
            showToast("▶️ เล่นเพลงทันที");
            return;
        }

        if (currentQueue.some(item => item.videoId === song.videoId)) {
            showToast("🎵 เพลงนี้อยู่ในคิวแล้ว");
            return;
        }

        currentQueue.push(song);
        if (currentQueue.length === 1) {
            playCurrentSong();
        } else {
            renderQueue();
        }
        showToast("🎵 เพิ่มเพลงเข้าคิวแล้ว");
    }

    function deleteSong(index) {
        if (index < 0 || index >= currentQueue.length) return;
        const song = currentQueue[index];
        if (!confirm(`ลบ "${song?.title || 'เพลงนี้'}" ออกจากคิว?`)) return;

        if (index === 0) {
            skipSong();
        } else {
            currentQueue.splice(index, 1);
            renderQueue();
            showToast("🗑️ ลบเพลงแล้ว");
        }
    }

    function moveSong(index, direction) {
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 1 || targetIndex >= currentQueue.length) return;

        const temp = currentQueue[index];
        currentQueue[index] = currentQueue[targetIndex];
        currentQueue[targetIndex] = temp;
        renderQueue();
    }

    function renderQueue() {
        const list = document.getElementById("queue-list");
        const count = document.getElementById("queue-count");

        count.innerText = `${currentQueue.length} เพลง`;

        if (currentQueue.length === 0) {
            list.innerHTML = '<div class="queue-empty">🎵 ยังไม่มีเพลงในคิว</div>';
            return;
        }

        list.innerHTML = currentQueue.map((song, index) => {
            const isPlaying = index === 0;
            return `
                <div class="queue-item ${isPlaying ? "playing" : ""}">
                    <div class="queue-number">${isPlaying ? "▶" : index + 1}</div>
                    <div class="queue-info">
                        ${isPlaying ? '<div class="queue-status">กำลังเล่น</div>' : ""}
                        <div class="queue-title">${escapeHtml(song.title || "ไม่ทราบชื่อ")}</div>
                        <div class="queue-channel">${escapeHtml(song.channel || song.author || "")}</div>
                    </div>
                    <div class="queue-actions">
                        ${index > 1 ? `<button class="queue-btn orange" onclick="moveSong(${index}, 'up')">▲</button>` : ""}
                        ${index > 0 && index < currentQueue.length - 1 ? `<button class="queue-btn orange" onclick="moveSong(${index}, 'down')">▼</button>` : ""}
                        <button class="queue-btn red" onclick="deleteSong(${index})">🗑</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    document.getElementById("search-input").addEventListener("keydown", event => {
        if (event.key === "Enter") searchMusic();
    });

    renderQueue();
</script>

</body>
</html>
