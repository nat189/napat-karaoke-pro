<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napat Karaoke Pro - Single Screen</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-microphone-lines text-red-500 text-2xl"></i>
      <h1 class="text-xl font-bold tracking-wide text-white">Napat <span class="text-red-500">Karaoke Pro</span></h1>
    </div>

    <!-- Quick Playback Controls -->
    <div class="flex items-center space-x-3">
      <button id="btnSkip" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-slate-700">
        <i class="fa-solid fa-forward"></i> ข้ามเพลง
      </button>
      <button id="btnRestart" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-2 border border-slate-700">
        <i class="fa-solid fa-rotate-left"></i> ร้องใหม่
      </button>
    </div>
  </header>

  <!-- Main Layout (2 Columns) -->
  <div class="flex-1 flex overflow-hidden">

    <!-- ฝั่งซ้าย: จอแสดงผลคาราโอเกะ (Video Player) -->
    <div class="flex-1 flex flex-col bg-black p-4">
      <div class="relative w-full h-full flex items-center justify-center rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-2xl">
        <div id="player" class="w-full h-full"></div>
        
        <!-- กรณีไม่มีเพลงกำลังเล่น -->
        <div id="noVideoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900 text-slate-400">
          <i class="fa-solid fa-music text-6xl mb-4 text-slate-600 animate-pulse"></i>
          <p class="text-xl font-semibold text-slate-300">ยังไม่มีเพลงในคิว</p>
          <p class="text-sm text-slate-500 mt-1">ค้นหาเพลงและกดเลือกเพื่อเริ่มร้องคาราโอเกะ</p>
        </div>
      </div>
      
      <!-- ข้อมูลเพลงที่กำลังเล่น -->
      <div class="mt-3 py-2 px-4 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between">
        <div class="truncate mr-4">
          <span class="text-xs uppercase px-2 py-0.5 rounded bg-red-600 font-bold text-white tracking-wider mr-2">NOW PLAYING</span>
          <span id="currentTitle" class="text-sm font-medium text-slate-200">ยังไม่มีเพลงกำลังเล่น</span>
        </div>
        <div id="queueCountBadge" class="text-xs text-slate-400 whitespace-nowrap bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
          คิวเพลง: 0 เพลง
        </div>
      </div>
    </div>

    <!-- ฝั่งขวา: ค้นหาเพลง + คิวเพลง -->
    <div class="w-[420px] bg-slate-900 border-l border-slate-800 flex flex-col shadow-xl">
      
      <!-- ช่องค้นหาเพลง -->
      <div class="p-4 border-b border-slate-800">
        <form id="searchForm" class="relative">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="ค้นหาชื่อเพลง, ศิลปิน..." 
            class="w-full bg-slate-950 border border-slate-700 focus:border-red-500 focus:outline-none rounded-xl py-3 pl-11 pr-12 text-sm text-white placeholder-slate-500 transition"
          />
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
          <button type="submit" class="absolute right-2 top-2 bg-red-600 hover:bg-red-700 text-white rounded-lg px-3 py-1.5 text-xs font-semibold transition">
            ค้นหา
          </button>
        </form>
      </div>

      <!-- Tab Switcher (ผลการค้นหา / รายการคิว) -->
      <div class="flex border-b border-slate-800 text-sm font-semibold bg-slate-950/40">
        <button id="tabSearch" class="flex-1 py-3 text-center border-b-2 border-red-500 text-red-500 transition">
          <i class="fa-solid fa-list mr-1"></i> ผลการค้นหา
        </button>
        <button id="tabQueue" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
          <i class="fa-solid fa-layer-group mr-1"></i> คิวเพลง (<span id="tabQueueCount">0</span>)
        </button>
      </div>

      <!-- Tab Content 1: ผลการค้นหาเพลง -->
      <div id="searchPanel" class="flex-1 overflow-y-auto p-3 custom-scroll">
        <div id="searchLoading" class="hidden text-center py-10 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-red-500 mb-2"></i>
          <p class="text-sm">กำลังค้นหาเพลงคาราโอเกะ...</p>
        </div>
        <div id="searchDefault" class="text-center py-12 text-slate-500 text-sm">
          พิมพ์ชื่อเพลงเพื่อค้นหาคาราโอเกะ
        </div>
        <div id="searchResults" class="space-y-2"></div>
      </div>

      <!-- Tab Content 2: คิวเพลง -->
      <div id="queuePanel" class="hidden flex-1 overflow-y-auto p-3 custom-scroll">
        <div id="queueEmpty" class="text-center py-12 text-slate-500 text-sm">
          ยังไม่มีเพลงในคิว
        </div>
        <div id="queueList" class="space-y-2"></div>
      </div>

    </div>
  </div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player = null;
    let isPlayerReady = false;
    let currentVideo = null;
    let queue = [];

    // Elements
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchLoading = document.getElementById('searchLoading');
    const searchDefault = document.getElementById('searchDefault');
    const queueList = document.getElementById('queueList');
    const queueEmpty = document.getElementById('queueEmpty');
    const noVideoPlaceholder = document.getElementById('noVideoPlaceholder');
    const currentTitle = document.getElementById('currentTitle');
    const queueCountBadge = document.getElementById('queueCountBadge');
    const tabQueueCount = document.getElementById('tabQueueCount');

    const tabSearch = document.getElementById('tabSearch');
    const tabQueue = document.getElementById('tabQueue');
    const searchPanel = document.getElementById('searchPanel');
    const queuePanel = document.getElementById('queuePanel');

    // โหลด YouTube Player
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      isPlayerReady = true;
    }

    // เมื่อเพลงเล่นจบ ให้ข้ามไปเพลงถัดไปในคิวอัตโนมัติ
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    // สลับ Tabs
    tabSearch.addEventListener('click', () => {
      tabSearch.className = "flex-1 py-3 text-center border-b-2 border-red-500 text-red-500 transition";
      tabQueue.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      searchPanel.classList.remove('hidden');
      queuePanel.classList.add('hidden');
    });

    tabQueue.addEventListener('click', () => {
      tabQueue.className = "flex-1 py-3 text-center border-b-2 border-red-500 text-red-500 transition";
      tabSearch.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
      queuePanel.classList.remove('hidden');
      searchPanel.classList.add('hidden');
    });

    // ยิงค้นหาผ่าน Cloudflare Functions: /api/search?q=...
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;

      searchDefault.classList.add('hidden');
      searchLoading.classList.remove('hidden');
      searchResults.innerHTML = '';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();

        searchLoading.classList.add('hidden');
        if (data.success && data.results && data.results.length > 0) {
          renderSearchResults(data.results);
        } else {
          searchResults.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">ไม่พบผลการค้นหา</div>`;
        }
      } catch (err) {
        searchLoading.classList.add('hidden');
        searchResults.innerHTML = `<div class="text-center py-8 text-red-400 text-sm">เกิดข้อผิดพลาดในการค้นหา</div>`;
      }
    });

    // แสดงผลลัพธ์การค้นหา
    function renderSearchResults(items) {
      searchResults.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = "p-2 rounded-xl bg-slate-950 border border-slate-800/80 hover:border-slate-700 flex items-center justify-between gap-3 transition group";
        div.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <img src="${item.thumbnail}" class="w-16 h-12 object-cover rounded-lg flex-shrink-0 bg-slate-800">
            <div class="truncate">
              <div class="text-xs font-semibold text-slate-200 truncate group-hover:text-white">${item.title}</div>
              <div class="text-[11px] text-slate-400 truncate mt-0.5">${item.channel} • ${item.duration || ''}</div>
            </div>
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0">
            <button onclick='addToQueue(${JSON.stringify(item)}, true)' class="px-2.5 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold transition" title="เล่นทันที">
              <i class="fa-solid fa-play"></i>
            </button>
            <button onclick='addToQueue(${JSON.stringify(item)}, false)' class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition border border-slate-700" title="ต่อคิว">
              + คิว
            </button>
          </div>
        `;
        searchResults.appendChild(div);
      });
    }

    // จัดการคิวเพลง
    function addToQueue(item, playNow = false) {
      if (playNow) {
        if (currentVideo) {
          queue.unshift(item);
          playNext();
        } else {
          startPlaying(item);
        }
      } else {
        if (!currentVideo) {
          startPlaying(item);
        } else {
          queue.push(item);
          updateQueueUI();
        }
      }
    }

    function startPlaying(item) {
      currentVideo = item;
      noVideoPlaceholder.classList.add('hidden');
      currentTitle.innerText = item.title;

      if (isPlayerReady && player) {
        player.loadVideoById(item.videoId);
      }
      updateQueueUI();
    }

    function playNext() {
      if (queue.length > 0) {
        const next = queue.shift();
        startPlaying(next);
      } else {
        currentVideo = null;
        currentTitle.innerText = "ยังไม่มีเพลงกำลังเล่น";
        noVideoPlaceholder.classList.remove('hidden');
        if (isPlayerReady && player) {
          player.stopVideo();
        }
        updateQueueUI();
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      updateQueueUI();
    }

    function updateQueueUI() {
      queueCountBadge.innerText = `คิวเพลง: ${queue.length} เพลง`;
      tabQueueCount.innerText = queue.length;

      if (queue.length === 0) {
        queueEmpty.classList.remove('hidden');
        queueList.innerHTML = '';
        return;
      }

      queueEmpty.classList.add('hidden');
      queueList.innerHTML = '';

      queue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-2.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between gap-3";
        div.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <span class="text-xs font-bold text-slate-500 w-4 text-center">${index + 1}</span>
            <img src="${item.thumbnail}" class="w-12 h-9 object-cover rounded-md flex-shrink-0 bg-slate-800">
            <div class="truncate">
              <div class="text-xs font-medium text-slate-200 truncate">${item.title}</div>
              <div class="text-[10px] text-slate-500 truncate">${item.channel}</div>
            </div>
          </div>
          <button onclick="removeFromQueue(${index})" class="text-slate-500 hover:text-red-400 p-1.5 transition">
            <i class="fa-solid fa-trash-can text-xs"></i>
          </button>
        `;
        queueList.appendChild(div);
      });
    }

    // ปุ่มควบคุม
    document.getElementById('btnSkip').addEventListener('click', () => {
      playNext();
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      if (currentVideo && isPlayerReady && player) {
        player.seekTo(0);
        player.playVideo();
      }
    });
  </script>
</body>
</html>
