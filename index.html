<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Napat Karaoke Pro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        .search-box button {
            padding: 0 25px;
            border: none;
            border-radius: 10px;
            background: #e91e63;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .search-box button:active {
            transform: scale(0.97);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            color: #aaa;
        }

        .result {
            display: flex;
            gap: 15px;
            background: #1d1d1d;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .result:hover {
            background: #292929;
        }

        .thumbnail {
            width: 180px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .channel {
            color: #aaa;
            margin-bottom: 8px;
        }

        .duration {
            color: #888;
        }

        @media (max-width: 600px) {

            .container {
                padding: 12px;
            }

            .search-box input {
                font-size: 16px;
            }

            .search-box button {
                padding: 0 15px;
            }

            .thumbnail {
                width: 120px;
                height: 68px;
            }

            .title {
                font-size: 15px;
            }

            .channel {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎤 Napat Karaoke Pro</h1>

    <div class="search-box">

        <input
            id="searchInput"
            type="text"
            placeholder="ค้นหาเพลงหรือศิลปิน..."
            autocomplete="off"
        >

        <button onclick="searchYouTube()">
            ค้นหา
        </button>

    </div>

    <div id="status" class="status">
        พิมพ์ชื่อเพลงเพื่อค้นหา
    </div>

    <div id="results"></div>

</div>

<script>

async function searchYouTube() {

    const input = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const status = document.getElementById("status");

    const q = input.value.trim();

    if (!q) {
        status.textContent = "กรุณาพิมพ์ชื่อเพลง";
        return;
    }

    status.textContent = "กำลังค้นหา...";
    results.innerHTML = "";

    try {

        const response = await fetch(
            "/api/search?q=" + encodeURIComponent(q)
        );

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Search failed");
        }

        if (!data.results || data.results.length === 0) {
            status.textContent = "ไม่พบเพลง";
            return;
        }

        status.textContent =
            `พบ ${data.results.length} รายการ`;

        data.results.forEach(video => {

            const item = document.createElement("div");

            item.className = "result";

            item.innerHTML = `

                <img
                    class="thumbnail"
                    src="${video.thumbnail}"
                    loading="lazy"
                >

                <div class="info">

                    <div class="title">
                        ${escapeHtml(video.title)}
                    </div>

                    <div class="channel">
                        ${escapeHtml(video.channel)}
                    </div>

                    <div class="duration">
                        ⏱ ${video.duration}
                    </div>

                </div>

            `;

            item.onclick = () => {

                window.open(
                    video.url,
                    "_blank"
                );

            };

            results.appendChild(item);

        });

    } catch (error) {

        console.error(error);

        status.textContent =
            "เกิดข้อผิดพลาดในการค้นหา";

    }
}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text || "";

    return div.innerHTML;
}


document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchYouTube();
        }

    });

</script>

</body>
</html>
