<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Napat Karaoke Pro - All in One</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --red: #ff2d55; 
            --dark: #121212; 
            --card: #1e1e1e; 
            --green: #32d74b; 
            --jbl-orange: #FF6A00; 
        }
        * { box-sizing: border-box; }
        body { 
            background: var(--dark); 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 12px; 
            padding-bottom: 80px; 
            -webkit-user-select: none; 
            user-select: none; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Video Container 16:9 */
        .video-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        .video-box iframe, .video-box #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Buttons */
        .btn-skip { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(to right, #ff2d55, #ff5e3a); 
            border: none; 
            color: white; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 18px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.3);
        }
        .btn-skip:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-pause { 
            width: 100%; 
            padding: 12px; 
            border-radius: 14px; 
            border: 1px solid #444; 
            color: white; 
            background: #5856d6; 
            margin-bottom: 14px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
        }
        .btn-pause:active { opacity: 0.85; }

        /* Search Box */
        .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
        input { 
            flex: 1; 
            padding: 12px 16px; 
            border-radius: 12px; 
            border: 1px solid #333; 
            background: #222; 
            color: white; 
            font-size: 15px; 
            outline: none; 
        }
        input:focus { border-color: #007aff; }
        .btn-search { 
            padding: 0 20px; 
            background: #007aff; 
            border: none; 
            color: white; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* Queue & Items */
        .queue-header { color: var(--green); font-weight: bold; font-size: 15px; margin-bottom: 10px; }
        .queue-item { 
            background: var(--card); 
            padding: 12px 14px; 
            border-radius: 14px; 
            margin-bottom: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #2c2c2c; 
        }
        .playing { border: 1px solid var(--green); background: rgba(50, 215, 75, 0.08); }
        .btn-move { background: #333; color: var(--jbl-orange); border: none; width: 40px; height: 40px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-reserve { background: #ff2d55; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-box">
            <div id="player"></div>
        </div>

        <button class="btn-skip" onclick="skipSong()">ข้ามเพลง ❯❯</button>
        <button id="pause-btn" class="btn-pause" onclick="togglePlay()">⏸️ หยุดชั่วคราว</button>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="ค้นหาเพลงคาราโอเกะ..." onkeypress="if(event.key==='Enter') searchMusic()">
            <button class="btn-search" onclick="searchMusic()">ค้นหา</button>
        </div>

        <div id="results"></div>

        <div class="queue-header">คิวเพลง (กดค้าง 2 วินาทีเพื่อลบ)</div>
        <div id="queue-list">
            <p style="color:#666; font-size:13px;">ยังไม่มีเพลงในคิว</p>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let queue = [];
        let isPaused = false;
        let pressTimer = null;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1, // เปิดแถบควบคุมบนมือถือเพื่อความสะดวก
                    'playsinline': 1, // บังคับให้เล่นในหน้าเว็บ ไม่เด้ง Fullscreen บน iPhone/iPad
                    'rel': 0,
                    'iv_load_policy': 3,
                    'cc_load_policy': 0
                },
                events: {
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) {
                            skipSong();
                        }
                    }
                }
            });
        }

        async function searchMusic() {
            const q = document.getElementById('search-input').value.trim();
            if (!q) return;

            const resDiv = document.getElementById('results');
            resDiv.innerHTML = '<p style="color:#888; text-align:center; padding:10px;">กำลังค้นหาเพลง...</p>';

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    resDiv.innerHTML = '<p style="color:#777; text-align:center; padding:10px;">ไม่พบเพลง</p>';
                    return;
                }

                resDiv.innerHTML = data.map(s => `
                    <div style="background:#1e1e1e; padding:10px; border-radius:12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; border:1px solid #333;">
                        <img src="${s.thumbnail}" width="65" height="45" style="border-radius:6px; object-fit:cover; background:#000;">
                        <div style="flex:1; min-width:0;">
                            <div style="font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.title}</div>
                            <small style="color:#888; font-size:11px;">${s.author || ''}</small>
                        </div>
                        <button class="btn-reserve" onclick='addSong(${JSON.stringify(s).replace(/'/g, "&apos;")})'>จอง</button>
                    </div>
                `).join('');
            } catch (err) {
                resDiv.innerHTML = '<p style="color:var(--red); text-align:center; padding:10px;">ค้นหาล้มเหลว</p>';
            }
        }

        function addSong(song) {
            queue.push(song);
            document.getElementById('results').innerHTML = '';
            document.getElementById('search-input').value = '';
            renderQueue();
            if (queue.length === 1) {
                playCurrent();
            }
        }

        function playCurrent() {
            if (queue.length > 0) {
                const current = queue[0];
                if (player && typeof player.loadVideoById === 'function') {
                    player.loadVideoById(current.videoId);
                }
            } else {
                if (player && typeof player.stopVideo === 'function') {
                    player.stopVideo();
                }
            }
            renderQueue();
        }

        function skipSong() {
            if (queue.length > 0) {
                queue.shift();
                playCurrent();
            }
        }

        function togglePlay() {
            if (!player || typeof player.getPlayerState !== 'function') return;
            isPaused = !isPaused;
            if (isPaused) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
            document.getElementById('pause-btn').innerText = isPaused ? "▶️ เล่นต่อ" : "⏸️ หยุดชั่วคราว";
        }

        function delSong(index, title) {
            if (confirm(`ลบเพลง "${title}" ออกจากคิว?`)) {
                queue.splice(index, 1);
                if (index === 0) {
                    playCurrent();
                } else {
                    renderQueue();
                }
            }
        }

        function moveSong(index, dir) {
            const target = dir === 'up' ? index - 1 : index + 1;
            if (target >= 1 && target < queue.length) {
                const temp = queue[index];
                queue[index] = queue[target];
                queue[target] = temp;
                renderQueue();
            }
        }

        function retryPlay() {
            if (player && typeof player.seekTo === 'function') {
                player.seekTo(0, true);
                player.playVideo();
            }
        }

        function renderQueue() {
            const list = document.getElementById('queue-list');
            if (queue.length === 0) {
                list.innerHTML = '<p style="color:#666; font-size:13px;">ยังไม่มีเพลงในคิว</p>';
                return;
            }

            list.innerHTML = queue.map((s, i) => `
                <div class="queue-item ${i === 0 ? 'playing' : ''}"
                     ontouchstart="pressTimer=setTimeout(()=>delSong(${i},'${s.title.replace(/'/g, "")}'), 2000)" 
                     ontouchend="clearTimeout(pressTimer)" 
                     onmousedown="pressTimer=setTimeout(()=>delSong(${i},'${s.title.replace(/'/g, "")}'), 2000)" 
                     onmouseup="clearTimeout(pressTimer)">
                    <div style="flex:1; min-width:0; padding-right:8px;">
                        <small style="color:var(--green); font-weight:bold;">${i === 0 ? 'กำลังเล่น' : 'คิวที่ ' + (i + 1)}</small>
                        <div style="font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px;">${s.title}</div>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        ${i === 0 ? `<button style="background:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;" onclick="retryPlay()">เริ่มใหม่</button>` : ''}
                        ${i > 0 ? `<button class="btn-move" onclick="event.stopPropagation(); moveSong(${i}, 'up')">▲</button>` : ''}
                        ${i > 0 && i < queue.length - 1 ? `<button class="btn-move" onclick="event.stopPropagation(); moveSong(${i}, 'down')">▼</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
